  // Superposition (13/11/2026, d'après les captures d'une autre appli envoyées par Arnaud ; tout est généré ici) :
  // deux calques de cases colorées en donnent un troisième. Deux lignes d'exemple montrent la règle, la troisième est à compléter.
  // N1 : on garde tout (OU), 3 × 3 ; N2 : ce qui se chevauche s'annule (OU exclusif), 3 × 3 ; N3 : idem en 4 × 4 ;
  // N4 : la règle est à trouver parmi quatre (tout, s'annule, seulement le commun, le 1er sans le 2e), 4 × 4 ;
  // N5 : idem, et le résultat est retourné comme dans un miroir (la gauche passe à droite).
  "superposition"(niveau) {
    const n = niveau <= 2 ? 3 : 4, N = n * n, miroir = niveau >= 5;
    const OPS = { ou: [(a, b) => a || b, "on garde toutes les cases colorées des deux calques"],
      xor: [(a, b) => a !== b, "une case colorée des deux côtés s'annule ; une case colorée d'un seul côté reste"],
      et: [(a, b) => a && b, "on ne garde que les cases colorées des deux côtés à la fois"],
      moins: [(a, b) => a && !b, "on garde les cases du 1er calque, sauf celles que le 2e recouvre"] };
    const regles = niveau === 1 ? ["ou"] : niveau <= 3 ? ["xor"] : Object.keys(OPS);
    const calque = () => { let c; do c = [...Array(N)].map(() => Math.random() < .45); while (c.filter(Boolean).length < Math.ceil(N / 4)); return c; };
    const brut = (op, a, b) => a.map((v, k) => OPS[op][0](v, b[k]));
    const appliquer = (op, a, b) => { const r = brut(op, a, b); return miroir ? r.map((_, k) => r[Math.floor(k / n) * n + (n - 1 - k % n)]) : r; };
    const cle = c => c.map(Number).join("");
    let op, ex, q;
    for (let essai = 0; essai < 300; essai++) {
      op = regles[alea(0, regles.length - 1)];
      ex = [0, 1].map(() => { const a = calque(), b = calque(); return [a, b, appliquer(op, a, b)]; });
      const a = calque(), b = calque(); q = [a, b, appliquer(op, a, b)];
      const autres = Object.keys(OPS).filter(o => o !== op);
      const tranche = autres.every(o => ex.some(([a, b, c]) => cle(appliquer(o, a, b)) !== cle(c)));   // les exemples écartent toute autre règle
      const distincte = autres.every(o => cle(appliquer(o, q[0], q[1])) !== cle(q[2]));                 // et la réponse n'est pas celle d'une autre règle
      if (tranche && distincte && q[2].some(Boolean) && ex.every(e => e[2].some(Boolean))) break;
    }
    const flip = () => { const c = [...q[2]], k = alea(0, N - 1); c[k] = !c[k]; return c; };
    const candidats = [...Object.keys(OPS).filter(o => o !== op).map(o => appliquer(o, q[0], q[1])), miroir ? brut(op, q[0], q[1]) : null, ...[...Array(8)].map(flip)];
    const vus = new Set([cle(q[2])]), choix = [q[2]];
    for (const c of candidats) if (c && choix.length < 4 && c.some(Boolean) && !vus.has(cle(c))) { vus.add(cle(c)); choix.push(c); }
    const ligne = ([a, b, c], question) => `<div class="sp-ligne">${svgCalque(a, n, "sp-a")}<span aria-hidden="true">+</span>${svgCalque(b, n, "sp-b")}<span aria-hidden="true">→</span>${question ? svgCalque(null, n) : svgCalque(c, n, "sp-c")}</div>`;
    return { q: "Les deux premières lignes montrent la règle. Quel calque complète la dernière ?",
      figure: `<div class="sp">${ex.map(e => ligne(e)).join("")}${ligne(q, true)}</div>`,
      enonce: `superposition N${niveau} (${op}${miroir ? " + miroir" : ""}) : ${cle(q[0])} + ${cle(q[1])}`,
      choix: choix.map(c => svgCalque(c, n, "sp-c")), texte: choix.map(cle), html: true, bonne: 0,
      pourquoi: `La règle : ${OPS[op][1]}${miroir ? ", puis le résultat est retourné comme dans un miroir (la colonne de gauche passe à droite)" : ""}. Méthode : compare case par case (colorée des deux côtés, d'un seul, d'aucun) et vérifie ta règle sur les deux exemples avant de regarder les choix.` };
  },

  // Pions dans une grille (16/11/2026, d'après les captures d'Arnaud ; tout est généré ici) : chaque pion se déplace avec son propre mouvement ;
  // quand il sort d'un côté, il revient par le côté opposé. N1 : 5 × 5, un pion, une case tout droit ; N2 : un pion, deux cases ou en diagonale ;
  // N3 : deux pions aux mouvements différents ; N4 : 6 × 6, deux pions, dont un au pas qui grandit ; N5 : 6 × 6, trois pions, dont un au pas qui grandit.
  "pions"(niveau) {
    const n = niveau >= 4 ? 6 : 5, COUL = ["sp-a", "sp-b", "sp-c"], NOMS = ["le rouge", "le bleu", "l'orange"];
    const DROIT = [[0, 1, "vers la droite"], [0, -1, "vers la gauche"], [1, 0, "vers le bas"], [-1, 0, "vers le haut"]];
    const DIAG = [[1, 1, "en diagonale vers le bas à droite"], [1, -1, "en diagonale vers le bas à gauche"], [-1, 1, "en diagonale vers le haut à droite"], [-1, -1, "en diagonale vers le haut à gauche"]];
    const un = (t, pas, grandit) => { const d = t[alea(0, t.length - 1)]; return { dr: d[0], dc: d[1], dit: d[2], pas, grandit }; };
    const plan = { 1: () => [un(DROIT, 1)], 2: () => [Math.random() < .5 ? un(DROIT, 2) : un(DIAG, 1)], 3: () => [un(DROIT, 1), Math.random() < .5 ? un(DIAG, 1) : un(DROIT, 2)],
      4: () => [un(DROIT, 0, true), Math.random() < .5 ? un(DIAG, 1) : un(DROIT, 2)], 5: () => [un(DROIT, 0, true), un(DIAG, 1), un(DROIT, 2)] }[niveau] || (() => [un(DROIT, 1)]);
    const mod = v => ((v % n) + n) % n, dep = (r, i) => r.grandit ? i * (i + 1) / 2 : r.pas * i;
    let regles, departs, t;
    for (let essai = 0; essai < 300; essai++) {
      regles = plan();
      departs = regles.map(r => niveau === 1 ? [r.dr ? (r.dr > 0 ? 0 : n - 1) : alea(0, n - 1), r.dc ? (r.dc > 0 ? 0 : n - 1) : alea(0, n - 1)] : [alea(0, n - 1), alea(0, n - 1)]);   // N1 : pas de sortie de la grille
      t = [0, 1, 2, 3, 4].map(i => regles.map((r, k) => [mod(departs[k][0] + r.dr * dep(r, i)), mod(departs[k][1] + r.dc * dep(r, i))]));
      if (t.every(g => new Set(g.map(p => p.join())).size === g.length)) break;   // jamais deux pions sur la même case
    }
    const a = t[4], cle = g => g.map(p => p.join(".")).join("-"), vus = new Set([cle(a)]), choix = [a];
    const bouge = (k, f) => a.map((p, j) => j === k ? [mod(p[0] + regles[k].dr * f), mod(p[1] + regles[k].dc * f)] : p);
    const cand = [t[3]];
    regles.forEach((r, k) => { const der = dep(r, 4) - dep(r, 3); cand.push(bouge(k, -2 * der), bouge(k, 1), bouge(k, -1), a.map((p, j) => j === k ? t[3][k] : p)); });
    if (a.length > 1) cand.push([a[1], a[0], ...a.slice(2)]);
    for (const c of melanger(cand)) if (choix.length < 4 && new Set(c.map(p => p.join())).size === c.length && !vus.has(cle(c))) { vus.add(cle(c)); choix.push(c); }
    const dit = regles.map((r, k) => `${regles.length > 1 ? NOMS[k] : "le pion"} se déplace ${r.grandit ? "de 1, puis 2, puis 3, puis 4 cases (le pas grandit)" : `de ${r.pas} case${r.pas > 1 ? "s" : ""}`} ${r.dit}`);
    return { q: "Où seront les pions dans la grille suivante ?", figure: `<div class="rang">${t.slice(0, 4).map(g => svgGrille(g, n, COUL)).join("")}${svgGrille(null)}</div>`,
      enonce: `pions N${niveau} (${n}×${n}) : ${t.slice(0, 4).map(cle).join(" | ")} ?`, choix: choix.map(g => svgGrille(g, n, COUL)), texte: choix.map(cle), html: true, bonne: 0,
      pourquoi: `La règle : ${dit.join(" ; ")}.${niveau > 1 ? " Quand un pion sort d'un côté, il revient par le côté opposé." : ""} Méthode : suis UN pion à la fois, compte ses cases d'une grille à la suivante, puis vérifie les autres.` };
  },

  // Motif qui se répète (16/11/2026, d'après les captures d'Arnaud) : une suite de figures qui revient en boucle.
  // N1 : motif de 2 ou 3 figures, la suivante ; N2 : motif de 4 où une forme revient pleine, la suivante ; N3 : motif de 3 ou 4, la figure à la 20ᵉ-45ᵉ place ;
  // N4 : motif de 5 où une forme revient deux fois, place lointaine ; N5 : la forme suit un motif de 3 et le remplissage un motif de 2 (le tout revient tous les 6).
  "motif"(niveau) {
    const FO = melanger([0, 3, 4, 5, 6]), NOMF = { 0: "rond", 3: "triangle", 4: "carré", 5: "pentagone", 6: "hexagone" };
    const fig = (c, plein = 0) => ({ c, rot: null, plein }), nom = f => NOMF[f.c] + (f.plein ? " plein" : "");
    let M = null, p, el, S, P;
    if (niveau >= 5) { S = FO.slice(0, 3); P = Math.random() < .5 ? [1, 0] : [0, 1]; p = 6; el = k => fig(S[k % 3], P[k % 2]); }
    else {
      if (niveau === 1) M = FO.slice(0, alea(2, 3)).map(c => fig(c));
      else if (niveau === 2) M = [fig(FO[0]), fig(FO[1]), fig(FO[0], 1), fig(FO[2])];
      else if (niveau === 3) M = FO.slice(0, alea(3, 4)).map(c => fig(c, alea(0, 1)));
      else M = melanger([FO[0], FO[0], FO[1], FO[2], FO[3]]).map(c => fig(c));
      p = M.length; el = k => M[k % p];
    }
    const montre = niveau <= 2 ? 2 * p + 1 : niveau >= 5 ? 8 : 2 * p, loin = niveau >= 3;
    const pos = loin ? alea(20, 45) : montre + 1, bonne = el(pos - 1), cle = f => f.c + "-" + f.plein;
    const vus = new Set([cle(bonne)]), choix = [bonne];
    const cand = [el(pos - 2), el(pos), { ...bonne, plein: 1 - bonne.plein }, ...[...Array(p).keys()].map(el), fig(FO[4]), fig(FO[3], 1)];
    for (const f of cand) if (choix.length < 4 && !vus.has(cle(f))) { vus.add(cle(f)); choix.push(f); }
    const seq = [...Array(montre).keys()].map(el), reste = (x, d) => `${x} ÷ ${d} = ${Math.floor(x / d)}, reste ${x % d}`;
    const calcul = niveau >= 5 ? `La forme revient tous les 3 (${S.map(c => NOMF[c]).join(", ")}) et le remplissage tous les 2 : on calcule chacun. Forme : ${reste(pos, 3)}, donc ${NOMF[S[(pos - 1) % 3]]} ; remplissage : ${reste(pos, 2)}, donc ${P[(pos - 1) % 2] ? "plein" : "vide"}.`
      : loin ? `Le motif fait ${p} figures (${[...Array(p).keys()].map(k => nom(el(k))).join(", ")}). ${reste(pos, p)} : ${pos % p ? `c'est la ${pos % p}ᵉ figure du motif` : "c'est la dernière figure du motif"}, un ${nom(bonne)}.`
      : `Le motif de ${p} figures revient en boucle : ${[...Array(p).keys()].map(k => nom(el(k))).join(", ")}. La suivante est un ${nom(bonne)}.`;
    return { q: loin ? `Le motif continue toujours de la même façon. Quelle figure sera à la ${pos}ᵉ place ?` : "Quelle figure vient ensuite ?",
      figure: `<div class="rang">${seq.map((f, k) => loin ? `<span class="motif-num">${svgFigure(f)}${k + 1}</span>` : svgFigure(f)).join("")}${loin ? "" : svgFigure(null)}</div>`,
      enonce: `motif N${niveau} : ${seq.map(cle).join(" ")} → place ${pos}`, choix: choix.map(svgFigure), texte: choix.map(cle), html: true, bonne: 0,
      pourquoi: `${calcul} Méthode : trouve d'abord où le motif recommence, compte sa longueur, puis divise la place demandée par cette longueur : le reste donne la figure.` };
  },

  // Rotations dans un cercle (14/11/2026, d'après les erreurs d'Arnaud sur les décagones de l'autre appli ; tout est généré ici) :
  // un cercle coupé en secteurs ; chaque secteur coloré tourne avec son propre pas et son propre sens. Quatre cercles, puis « ? ».
  // N1 : 8 secteurs, un marqueur, pas de 1 ; N2 : un marqueur, pas de 2 ou 3, dans un sens ou l'autre ; N3 : deux marqueurs, sens opposés ;
  // N4 : 10 secteurs, deux marqueurs aux pas différents ; N5 : 10 secteurs, trois marqueurs, dont un dont le pas grandit (1, 2, 3, 4).
  "rotations"(niveau) {
    const n = niveau >= 4 ? 10 : 8, COUL = ["sp-a", "sp-b", "sp-c"], NOMS = ["le rouge", "le bleu", "l'orange"];
    const pasAlea = (min, max) => alea(min, max) * (Math.random() < .5 ? 1 : -1);
    let regles;
    if (niveau === 1) regles = [{ pas: 1 }];
    else if (niveau === 2) regles = [{ pas: pasAlea(2, 3) }];
    else if (niveau === 3) { const p = alea(1, 2); regles = [{ pas: p }, { pas: -alea(1, 2) }]; }
    else if (niveau === 4) { let a, b; do { a = pasAlea(1, 3); b = pasAlea(1, 3); } while (a === b); regles = [{ pas: a }, { pas: b }]; }
    else { let a, b; do { a = pasAlea(1, 3); b = pasAlea(1, 3); } while (a === b); regles = [{ pas: a }, { pas: b }, { grandit: Math.random() < .5 ? 1 : -1 }]; }
    const pos = (r, d, i) => { const dep = r.grandit ? r.grandit * i * (i + 1) / 2 : r.pas * i; return (((d + dep) % n) + n) % n; };
    let departs, t;
    for (let essai = 0; essai < 300; essai++) {
      departs = regles.map(() => alea(0, n - 1));
      t = [0, 1, 2, 3, 4].map(i => regles.map((r, k) => pos(r, departs[k], i)));
      if (t.every(c => new Set(c).size === c.length)) break;   // deux marqueurs ne tombent jamais dans le même secteur
    }
    const a = t[4], cle = c => c.join("-"), vus = new Set([cle(a)]), choix = [a];
    const autre = (k, p) => a.map((v, j) => j === k ? (((v + p) % n) + n) % n : v);
    const candidats = [];
    regles.forEach((r, k) => { const dernier = r.grandit ? r.grandit * 4 : r.pas; candidats.push(autre(k, -2 * dernier), autre(k, 1), autre(k, -1)); });
    candidats.push(t[3]);
    if (a.length > 1) candidats.push([a[1], a[0], ...a.slice(2)]);
    for (const c of melanger(candidats)) if (choix.length < 4 && new Set(c).size === c.length && !vus.has(cle(c))) { vus.add(cle(c)); choix.push(c); }
    const sens = p => p > 0 ? "dans le sens des aiguilles d'une montre" : "dans le sens inverse des aiguilles d'une montre";
    const dit = regles.map((r, k) => `${regles.length > 1 ? NOMS[k] : "le secteur coloré"} ${r.grandit ? `avance de 1, puis 2, puis 3, puis 4 secteurs (le pas grandit), ${sens(r.grandit)}` : `avance de ${Math.abs(r.pas)} secteur${Math.abs(r.pas) > 1 ? "s" : ""} ${sens(r.pas)}`}`);
    return { q: "Quel cercle vient ensuite ?", figure: `<div class="rang">${t.slice(0, 4).map(c => svgCercle(c, n, COUL)).join("")}${svgCercle(null)}</div>`,
      enonce: `rotations N${niveau} (${n} secteurs) : ${t.slice(0, 4).map(cle).join(" | ")} ?`, choix: choix.map(c => svgCercle(c, n, COUL)), texte: choix.map(cle), html: true, bonne: 0,
      pourquoi: `La règle : ${dit.join(" ; ")}. Méthode : suis UNE couleur à la fois sur les quatre cercles, compte ses secteurs d'un cercle au suivant, et vérifie le sens avant de regarder les choix.` };
  }
};

// Un cercle de rotation : n secteurs, ceux des marqueurs colorés (une couleur par marqueur) ; null = la case « ? ».
function svgCercle(c, n, coul) {
  if (!c) return svgCase(null);
  const R = 30, pt = a => `${(35 + R * Math.sin(a)).toFixed(1)},${(35 - R * Math.cos(a)).toFixed(1)}`;
  const secteur = (k, cls) => { const a0 = 2 * Math.PI * k / n, a1 = 2 * Math.PI * (k + 1) / n; return `<path d="M35,35 L${pt(a0)} A${R},${R} 0 0 1 ${pt(a1)} Z" class="${cls}"/>`; };
  const coul_de = k => { const i = c.indexOf(k); return i < 0 ? "sp-vide" : coul[i]; };
  return `<svg class="case" viewBox="0 0 70 70" role="img" aria-label="cercle de ${n} secteurs, secteurs colorés : ${c.map((v, i) => `${["rouge", "bleu", "orange"][i]} en ${v + 1}`).join(", ")}"><rect x="1" y="1" width="68" height="68" rx="8" class="m-fond"/>${[...Array(n).keys()].map(k => secteur(k, coul_de(k))).join("")}<circle cx="35" cy="35" r="${R}" class="m-creux"/><circle cx="35" cy="5" r="2" class="m-plein"/></svg>`;
}

// Une grille de pions : n × n cases, un rond coloré par pion ([ligne, colonne]) ; null = la case « ? ».
function svgGrille(g, n, coul) {
  if (!g) return svgCase(null);
  const t = 60 / n, cases = [];
  for (let k = 0; k < n * n; k++) cases.push(`<rect x="${(5 + (k % n) * t).toFixed(1)}" y="${(5 + Math.floor(k / n) * t).toFixed(1)}" width="${t.toFixed(1)}" height="${t.toFixed(1)}" class="sp-vide"/>`);
  const pions = g.map(([r, c], i) => `<circle cx="${(5 + (c + .5) * t).toFixed(1)}" cy="${(5 + (r + .5) * t).toFixed(1)}" r="${(t * .38).toFixed(1)}" class="${coul[i]}"/>`);
  return `<svg class="case grille" viewBox="0 0 70 70" role="img" aria-label="grille ${n} par ${n}, pions : ${g.map(([r, c], i) => `${["rouge", "bleu", "orange"][i]} ligne ${r + 1} colonne ${c + 1}`).join(", ")}"><rect x="1" y="1" width="68" height="68" rx="8" class="m-fond"/>${cases.join("")}${pions.join("")}</svg>`;
}

// Un calque de superposition : une grille n × n de cases, colorées (classe cls) ou vides ; null = la case « ? ».
function svgCalque(c, n, cls) {
  if (!c) return svgCase(null);
  const t = 60 / n;
  return `<svg class="case" viewBox="0 0 70 70" role="img" aria-label="grille ${n} par ${n}, cases colorées : ${c.map((v, k) => v ? k + 1 : null).filter(Boolean).join(", ") || "aucune"}"><rect x="1" y="1" width="68" height="68" rx="8" class="m-fond"/>${c.map((v, k) =>
    `<rect x="${(5 + (k % n) * t).toFixed(1)}" y="${(5 + Math.floor(k / n) * t).toFixed(1)}" width="${t.toFixed(1)}" height="${t.toFixed(1)}" class="${v ? cls : "sp-vide"}"/>`).join("")}</svg>`;
}

// Une figure de suite : polygone (ou rond) au centre, flèche qui part du centre ; null = la case « ? ».
function svgFigure(f) {
  if (!f) return svgCase(null);
  const cls = f.plein ? "m-plein" : "m-creux", R = 27;
  const forme = f.c ? `<polygon class="${cls}" points="${[...Array(f.c).keys()].map(k => { const a = (-90 + (f.c % 2 ? 0 : 180 / f.c) + 360 * k / f.c) * Math.PI / 180; return `${(35 + R * Math.cos(a)).toFixed(1)},${(35 + R * Math.sin(a)).toFixed(1)}`; }).join(" ")}"/>` : `<circle class="${cls}" cx="35" cy="35" r="${R}"/>`;
  let fleche = "";
  if (f.rot !== null) {
    const a = f.rot * Math.PI / 180, px = (r, d = 0) => (35 + r * Math.sin(a + d)).toFixed(1), py = (r, d = 0) => (35 - r * Math.cos(a + d)).toFixed(1);
    fleche = `<path class="f-fleche${f.plein ? " inv" : ""}" d="M${px(-10)} ${py(-10)}L${px(17)} ${py(17)}M${px(9, -.5)} ${py(9, -.5)}L${px(17)} ${py(17)}L${px(9, .5)} ${py(9, .5)}"/>`;
  }
  const noms = ["rond", , , "triangle", "carré", "pentagone", "hexagone", "heptagone", "octogone"];
  return `<svg class="case" viewBox="0 0 70 70" role="img" aria-label="${noms[f.c] || f.c + " côtés"} ${f.plein ? "plein" : "vide"}${f.rot !== null ? `, flèche à ${f.rot}°` : ""}"><rect x="1" y="1" width="68" height="68" rx="8" class="m-fond"/>${forme}${fleche}</svg>`;
}

// Dessins de la logique (SVG produits par l'appli). Un domino : haut et bas, de 0 à 6 points ; null = la case « ? ».
const PIPS = [[], [4], [0, 8], [0, 4, 8], [0, 2, 6, 8], [0, 2, 4, 6, 8], [0, 2, 3, 5, 6, 8]];
function svgDomino(d) {
  if (!d) return `<svg class="domino" viewBox="0 0 40 78" width="40" height="78" aria-label="domino à trouver"><rect x="1" y="1" width="38" height="76" rx="6" class="d-vide"/><text x="20" y="46" text-anchor="middle" class="d-q">?</text></svg>`;
  return `<svg class="domino" viewBox="0 0 40 78" width="40" height="78" role="img" aria-label="domino ${d[0]} et ${d[1]}"><rect x="1" y="1" width="38" height="76" rx="6" class="d-fond"/><line x1="6" y1="39" x2="34" y2="39" class="d-trait"/>${d.map((v, k) => PIPS[v].map(p => `<circle cx="${9 + (p % 3) * 11}" cy="${k * 38 + 9 + Math.floor(p / 3) * 11}" r="3.6" class="d-point"/>`).join("")).join("")}</svg>`;
}
// Une case de matrice : [forme 0 rond / 1 carré / 2 triangle, nombre 0-2 (= 1 à 3 formes), remplissage 0 plein / 1 vide / 2 gris].
const POSITIONS = [[[35, 35]], [[21, 35], [49, 35]], [[20, 47], [50, 47], [35, 21]]];
function svgCase(c) {
  if (!c) return `<svg class="case" viewBox="0 0 70 70" aria-label="case à trouver"><rect x="1" y="1" width="68" height="68" rx="8" class="m-vide"/><text x="35" y="44" text-anchor="middle" class="d-q">?</text></svg>`;
  const [f, n, r] = c, cls = ["m-plein", "m-creux", "m-gris"][r];
  const forme = ([x, y]) => f === 0 ? `<circle cx="${x}" cy="${y}" r="9" class="${cls}"/>` : f === 1 ? `<rect x="${x - 8}" y="${y - 8}" width="16" height="16" class="${cls}"/>` : `<path d="M${x} ${y - 10}L${x + 10} ${y + 8}H${x - 10}Z" class="${cls}"/>`;
  return `<svg class="case" viewBox="0 0 70 70" role="img" aria-label="${n + 1} ${["rond", "carré", "triangle"][f]}${n ? "s" : ""} ${["plein", "vide", "gris"][r]}${n ? "s" : ""}"><rect x="1" y="1" width="68" height="68" rx="8" class="m-fond"/>${POSITIONS[n].map(forme).join("")}</svg>`;
}

function preparer(q, retour) {
  let x = { ...q, type: q.type || "qcm", _src: q, _retour: !!retour };
  if (x.type === "generateur") x = { ...x, ...GENERATEURS[q.gen](q.niveau) };
  if (x.choix) x.ordreChoix = melanger(x.choix.map((_, i) => i));
  if (x.type === "ordre") { x.melange = melanger(x.etapes.map((_, i) => i)); x.pris = []; }
  if (x.type === "associer") { x.gauche = melanger(x.couples.map((_, i) => i)); x.droite = melanger(x.couples.map((_, i) => i)); x.trouves = []; x.sel = null; x.fautes = 0; x.flash = null; }
  return x;
}

// Test aléatoire pondéré : une question de la boîte 0 a 6 fois plus de chances de sortir qu'une question de la boîte 5 (qui ne disparaît pas pour autant).
// paires (facultatif) : limite le tirage aux paires choisies (test ciblé).
function tirage(n, exclus = new Set(), paires = null) {
  return tirerPondere(ouvertes().filter(q => !exclus.has(q.id) && (!paires || paires.includes(q.paire))).map(q => ({ q, w: 6 - carte(q.id).boite })), n);
}

// Test ciblé (18/11/2026) : les paires cochées sur l'accueil, gardées d'une visite à l'autre ; on oublie celles qui n'existent plus.
const ciblees = () => (etat.ciblees || []).filter(id => D.questions.some(q => q.paire === id));
const nbCiblees = () => ouvertes().filter(q => ciblees().includes(q.paire)).length;

const fragiles = exclus => aRevoir().filter(q => !exclus.has(q.id)).sort((a, b) => carte(a.id).boite - carte(b.id).boite || Math.random() - .5);

// Session du jour : les questions dues (les plus fragiles d'abord), avec au moins RAPPELS_MIN() rappels ; s'il manque des dues, les rappels complètent la session.
// bonus = "cible" : test aléatoire limité aux paires cochées.
function demarrer(bonus) {
  let liste, nbRappels = 0;
  if (bonus) liste = tirage(taille(), new Set(), bonus === "cible" ? ciblees() : null);
  else {
    const dus = fragiles(new Set()), nonDus = nbNonDues();
    const nbDus = Math.min(dus.length, taille() - Math.min(RAPPELS_MIN(), nonDus));
    liste = dus.slice(0, nbDus);
    const r = rappels(taille() - liste.length, new Set(liste.map(q => q.id)));
    nbRappels = r.length;
    liste = melanger([...liste.map(q => preparer(q)), ...r.map(q => ({ ...preparer(q), _rappel: true }))]);
  }
  const file = limiterExplications(bonus ? liste.map(q => preparer(q)) : liste, bonus === "cible" ? "cible" : bonus ? "aleatoire" : "jour");
  session = { file, total: file.length, faites: 0, justes: 0, xp: 0, ratees: new Set(), retoursPasses: 0, passees: 0,
              ids: new Set(file.map(x => x.id)), etape: "repondre", res: null, mode: bonus === "cible" ? "cible" : bonus ? "aleatoire" : "jour" };
  envoi = null;
  afficher();
}

// Explications écrites (règle d'Arnaud, 27/11/2026) : le Mémo est un Duolingo rapide, les explications longues se font en cours.
// Au plus MAX_EXPLIQUE explication(s) par session ; les autres sont remplacées par des questions rapides (leur carte ne bouge pas, elles reviendront).
const MAX_EXPLIQUE = 1;
function limiterExplications(liste, mode) {
  let vues = 0; const garde = []; let manque = 0;
  for (const x of liste) { if ((x.type || "qcm") === "explique" && ++vues > MAX_EXPLIQUE) manque++; else garde.push(x); }
  if (!manque) return liste;
  const exclus = new Set([...liste.map(x => x.id), ...D.questions.filter(q => q.type === "explique").map(q => q.id)]);
  const pris = mode === "jour" ? [...fragiles(exclus), ...rappels(manque, exclus)] : tirage(manque, exclus, mode === "cible" ? ciblees() : null);
  const vus = new Set();
  for (const q of pris) {
    if (!manque) break;
    if (vus.has(q.id) || exclus.has(q.id)) continue;
    vus.add(q.id); manque--;
    garde.push({ ...preparer(q), _rappel: mode === "jour" && carte(q.id).due > jour() });
  }
  return garde;
}

// « Passer » : la question n'est ni ratée ni réussie (sa carte ne bouge pas, elle reviendra) ; une autre prend sa place, de préférence rapide (jamais une explication écrite).
function remplacant() {
  const rapide = q => (q.type || "qcm") !== "explique";
  const exclus = new Set([...session.ids, ...D.questions.filter(q => !rapide(q)).map(q => q.id)]);
  if (session.mode === "aleatoire") return tirage(1, exclus)[0];
  if (session.mode === "cible") return tirage(1, exclus, ciblees())[0];
  return fragiles(exclus)[0] || rappels(1, exclus)[0];
}

function passer() {
  const x = session.file.shift();
  etat.journal.push({ t: new Date().toISOString(), q: x.id, type: x.type, passe: true, essai: 0, mode: session.mode, ...(x.fam ? { fam: x.fam, niveau: x.niveau } : {}) });
  sauver();
  session.passees++;
  if (session.mode === "logique") session.file.push(exerciceLogique(choisirFamille(x.fam)));   // un autre exercice, d'une autre famille si possible
  else if (session.mode === "entretien") { const q = choisirOral(session.ids); if (q) { session.ids.add(q.id); session.file.push(preparerOral(q)); } else session.total--; }
  else if (x._retour) session.retoursPasses++;
  else {
    const q = remplacant();
    if (q) { session.ids.add(q.id); session.file.push({ ...preparer(q), _rappel: carte(q.id).due > jour() && session.mode === "jour" }); }
    else session.total--;
  }
  session.res = null; session.etape = "repondre"; session.texte = "";
  terminerSiVide();
  afficher();
  if (!session.fini) document.querySelector("#saisie, #explication")?.focus();
}

const NIVEAUX = ["", "Reconnaître", "Retrouver seul", "Appliquer"];

// ---- Onglet Logique : entraînement aux tests d'admission (suites, dominos, matrices, calcul, déduction) ----
// Pas de boîtes de révision : chaque exercice est neuf. Le niveau s'adapte par famille : 3 réussites d'affilée = niveau au-dessus, 2 erreurs d'affilée = niveau en dessous.
// limite : temps visé par question, en secondes (en mode concours, au-delà, c'est compté faux).
const FAMILLES = {
  suites:    { nom: "Suites de nombres", gen: "suite-logique", limite: 45, max: 5 },
  lettres:   { nom: "Suites de lettres", gen: "suite-lettres", limite: 45, max: 5 },
  dominos:   { nom: "Dominos",           gen: "dominos",       limite: 45, max: 5 },
  matrices:  { nom: "Matrices",          gen: "matrices",      limite: 60, max: 4 },
  calcul:    { nom: "Calcul mental",     gen: "calcul",        limite: 60, max: 5 },
  deduction: { nom: "Déduction",         gen: "deduction",     limite: 60, max: 5 },
  figures:   { nom: "Suites de figures", gen: "figures",       limite: 60, max: 5 },
  intrus:    { nom: "L'intrus",          gen: "intrus",        limite: 45, max: 5 },
  analogies: { nom: "Analogies",         gen: "analogies",     limite: 45, max: 5 },
  superposition: { nom: "Superposition",  gen: "superposition", limite: 60, max: 5 },
  rotations: { nom: "Rotations",          gen: "rotations",     limite: 60, max: 5 },
  pions:     { nom: "Pions dans une grille", gen: "pions",     limite: 60, max: 5 },
  motif:     { nom: "Motif qui se répète", gen: "motif",       limite: 60, max: 5 }
};
// max : niveau le plus haut de la famille (3 par défaut). Niveaux 4 et 5 partout depuis le 16/11/2026 (décision du 13/11 : le test d'admission
// serait très difficile) ; les matrices s'arrêtent au 4 (même règles qu'au 3, mais les mauvais choix ne diffèrent que par un détail).
const maxNiv = f => FAMILLES[f]?.max || 3;
const statLogique = f => (etat.logique[f] ||= { niveau: 1, serie: 0, ko: 0, n: 0, ok: 0, ms: 0 });
const duree = ms => { const s = Math.round(ms / 1000); return s < 60 ? `${s} s` : `${Math.floor(s / 60)} min${s % 60 ? ` ${String(s % 60).padStart(2, "0")}` : ""}`; };
const chronoTexte = x => {
  const s = Math.floor((Date.now() - (x.debut || Date.now())) / 1000);
  if (x.type === "oral") return `⏱ ${duree(s * 1000)} / ${duree(x.duree * 1000)}`;
  const lim = FAMILLES[x.fam].limite; return etat.concours ? `⏱ ${Math.max(0, lim - s)} s` : `⏱ ${s} s`;
};

function exerciceLogique(f, niveau = statLogique(f).niveau) {
  const x = { id: "L-" + f, fam: f, niveau, type: "logique", paire: null, ...GENERATEURS[FAMILLES[f].gen](niveau) };
  x.ordreChoix = melanger(x.choix.map((_, i) => i));
  return x;
}

// ---- Mini-calculatrice (12/11/2026, élargie le 13/11) : seulement si l'option est cochée (= mode entraînement, beaucoup de tests l'interdisent),
// dans tous les exercices où il y a des nombres à manipuler (calcul, suites, dominos, matrices, intrus et analogies à chiffres), simulation comprise.
const FAM_CHIFFRES = ["calcul", "suites", "dominos", "matrices"];
const aDesChiffres = x => FAM_CHIFFRES.includes(x.fam) || (["intrus", "analogies"].includes(x.fam) && /\d/.test(x.q + " " + (x.texte || x.choix || []).join(" ")));
const calculatriceVisible = x => etat.calc && x.type === "logique" && aDesChiffres(x) && session.etape === "repondre";
// ---- Alphabet repère (13/11/2026, demande d'Arnaud) : bouton afficher / cacher sur les exercices à lettres ; l'état ouvert ou fermé est gardé ----
const aDesLettres = x => x.type === "logique" && (x.fam === "lettres" || /(^|[^A-Za-zÀ-ÿ])[A-Z]([^A-Za-zÀ-ÿ]|$)/.test(x.q + " " + (x.texte || x.choix || []).join(" ")));

      `<span${(i + 1) % 5 ? "" : ' class="repere"'}>${l}<small>${i + 1}</small></span>`).join("")}</div>`;
}
function basculerAlphabet() {

}
const TOUCHES = ["7", "8", "9", "÷", "4", "5", "6", "×", "1", "2", "3", "−", "0", ",", "=", "+"];
function calculatrice(x) {
  if (!calculatriceVisible(x)) return "";
  return `<div class="calc" aria-label="Calculatrice">
      <div class="ecran" id="ecran" aria-live="polite">${esc(session.calc || "0")}</div>
      <div class="touches">${TOUCHES.map(t => `<button data-calc="${t}" aria-label="${{ "÷": "diviser", "×": "multiplier", "−": "moins", "+": "plus", "=": "égal", ",": "virgule" }[t] || t}">${t}</button>`).join("")}
        <button class="large" data-calc="C">C</button><button class="large" data-calc="⌫" aria-label="effacer le dernier chiffre">⌫</button></div>
    </div>`;
}
// Calcul sans eval : × et ÷ d'abord, puis + et − de gauche à droite. Renvoie null si l'expression est incomplète.
function calculer(s) {
  const t = s.replace(/,/g, ".").match(/\d*\.?\d+|[+−×÷]/g);
  if (!t || !t.length) return null;
  const termes = [+t[0]], ops = [];
  if (isNaN(termes[0])) return null;
  for (let i = 1; i < t.length; i += 2) {
    const op = t[i], n = +t[i + 1];
    if (!"+−×÷".includes(op) || t[i + 1] === undefined || isNaN(n)) return null;
    if (op === "×") termes.push(termes.pop() * n);
    else if (op === "÷") { if (!n) return null; termes.push(termes.pop() / n); }
    else { ops.push(op); termes.push(n); }
  }
  let r = termes[0]; ops.forEach((op, k) => { r = op === "+" ? r + termes[k + 1] : r - termes[k + 1]; });
  return Math.round(r * 1e6) / 1e6;
}
function toucheCalc(t) {
  let e = session.calc || "";
  const x = session.file[0]; x.calc = true;   // noté dans le journal : réponse trouvée avec la calculatrice
  if (t === "C") e = "";
  else if (t === "⌫") e = e.slice(0, -1);
  else if (t === "=") { const r = calculer(e); e = r === null ? e : String(r).replace(".", ","); }
  else if ("+−×÷".includes(t)) e = /[+−×÷]$/.test(e) ? e.slice(0, -1) + t : e ? e + t : "";
  else e += t;
  session.calc = e;
  const ecran = document.getElementById("ecran"); if (ecran) ecran.textContent = e || "0";
}

// Famille suivante : les plus ratées et les moins pratiquées sortent plus souvent ; jamais deux fois de suite la même (sauf si une seule est choisie).
function choisirFamille(precedente) {
  const fams = FAMILLES[etat.famLogique] ? [etat.famLogique] : Object.keys(FAMILLES);
  const pool = fams.filter(f => f !== precedente || fams.length === 1).map(f => { const s = statLogique(f); return { q: f, w: 1 + 2 * (s.n ? 1 - s.ok / s.n : 1) + (s.n < 10 ? 1 : 0) }; });
  return tirerPondere(pool, 1)[0];
}

function demarrerLogique() {
  const f = choisirFamille(null);
  session = { file: [exerciceLogique(f)], total: taille("tailleLogique"), faites: 0, justes: 0, xp: 0, ratees: new Set(), retoursPasses: 0, passees: 0,
              ids: new Set(), etape: "repondre", res: null, mode: "logique", derniere: f, ms: 0, changements: [], t0: new Date().toISOString(), concours: !!etat.concours };
  envoi = null;
  afficher();
}

function finaliserLogique() {
  const x = session.file[0], res = session.res, s = statLogique(x.fam);
  session.etape = "verdict"; session.derniere = x.fam; session.niveauMsg = "";
  res.ms = Math.min(Date.now() - (x.debut || Date.now()), 10 * 60 * 1000);
  s.n++; s.ms += res.ms; session.ms += res.ms;
  if (res.ok) {
    s.ok++; s.ko = 0; session.justes++; session.xp += 10;
    if (++s.serie >= 3 && s.niveau < maxNiv(x.fam)) { s.niveau++; s.serie = 0; session.niveauMsg = `Niveau ${s.niveau}/${maxNiv(x.fam)} débloqué en ${FAMILLES[x.fam].nom.toLowerCase()} !`; session.changements.push(`${FAMILLES[x.fam].nom} : niveau ${s.niveau} ↑`); }
  } else {
    s.serie = 0; session.ratees.add(x.fam);
    if (++s.ko >= 2 && s.niveau > 1) { s.niveau--; s.ko = 0; session.niveauMsg = `On redescend au niveau ${s.niveau}/${maxNiv(x.fam)} pour consolider.`; session.changements.push(`${FAMILLES[x.fam].nom} : niveau ${s.niveau} ↓`); }
  }
  const e = { t: new Date().toISOString(), q: x.id, type: "logique", fam: x.fam, niveau: x.niveau, rep: x.texte ? (res.r !== undefined ? x.texte[res.r] : res.rep) : res.rep, ok: res.ok, essai: 1, mode: "logique", ms: res.ms, enonce: x.enonce };
  if (res.nsp) e.nsp = true;
  if (res.temps) e.temps = true;
  if (x.calc) e.calc = true;
  etat.journal.push(e);
  sauver();
}

// ---- Simulation de test (12/11/2026) : comme le jour J, pour mesurer la progression jusqu'au test de mars 2027 ----
// Toutes les familles mélangées (jamais deux fois la même d'affilée), difficulté qui monte par tiers (niveau 1, puis 2, puis 3),
// un seul chrono, aucune correction avant la fin. Une question passée revient à la fin. Les niveaux adaptatifs de l'entraînement ne bougent pas.
const SIMU = { 30: 40, 45: 60 };   // durée en minutes → nombre de questions (environ 45 s par question)
const resteSimu = () => { const s = Math.max(0, Math.ceil((session.fin - Date.now()) / 1000)); return `⏱ ${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; };
const pc = (a, n) => n ? Math.round(100 * a / n) : 0;

function carteSimulation() {
  const d = SIMU[etat.simuDuree] ? etat.simuDuree : 30, h = etat.simulations || [];
  return `
    <section class="card">

      <p style="margin:0">Toutes les familles mélangées, une difficulté qui monte, un seul chrono pour tout le test et aucune correction avant la fin. Une question te bloque ? Passe : elle revient à la fin s'il reste du temps.</p>
      <div class="segment" style="grid-template-columns:1fr 1fr" role="group" aria-label="Durée de la simulation">${Object.entries(SIMU).map(([m, n]) =>
        `<button data-simu="${m}" aria-pressed="${d === +m}">${m} min · ${n} questions</button>`).join("")}</div>
      <button class="big" id="go-simu">Lancer la simulation</button>
      ${h.length ? `<table class="tableau"><thead><tr><th>Date</th><th>Durée</th><th>Score</th><th>Répondues</th></tr></thead>
        <tbody>${h.slice(-6).reverse().map(s => `<tr><td>${new Date(s.t).toLocaleDateString("fr-FR")}</td><td>${s.duree} min</td><td><b>${s.justes}/${s.n}</b> (${pc(s.justes, s.n)} %)</td><td>${s.repondues}/${s.n}</td></tr>`).join("")}</tbody></table>
        <p class="note" style="text-align:left;margin:0">Meilleur score : ${Math.max(...h.map(s => pc(s.justes, s.n)))} % · ${h.length} simulation${h.length > 1 ? "s" : ""} en tout.</p>`
        : `<p class="note" style="text-align:left;margin:0">Ton historique apparaîtra ici, pour mesurer ta progression jusqu'au test de mars.</p>`}
    </section>`;
}

function demarrerSimulation() {
  const d = SIMU[etat.simuDuree] ? etat.simuDuree : 30, n = SIMU[d], fams = Object.keys(FAMILLES), ordre = [];
  while (ordre.length < n) { const tour = melanger([...fams]); if (tour[0] === ordre[ordre.length - 1]) tour.push(tour.shift()); ordre.push(...tour); }
  const file = ordre.slice(0, n).map((f, i) => ({ ...exerciceLogique(f, Math.min(maxNiv(f), 1 + Math.floor(5 * i / n))), num: i + 1 }));
  session = { mode: "simulation", file, total: n, duree: d, debut: Date.now(), fin: Date.now() + d * 60000, reponses: [], passees: 0,
              etape: "repondre", res: null, faites: 0, justes: 0, xp: 0, ratees: new Set(), retoursPasses: 0, ids: new Set(), calc: "" };
  envoi = null;
  afficher();
}

function vueSimulation() {
  const x = session.file[0];
  if (!x.debut) x.debut = Date.now();
  const pct = pc(session.reponses.length, session.total);
  return `
    <div class="progress" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div>
    <section class="card">
      <div class="qhead"><span class="theme">Question ${x.num} / ${session.total}${x.passee ? " · tu l'avais passée" : ""}</span><span class="chrono" id="chrono-simu">${resteSimu()}</span></div>
      <div class="question">${esc(x.q).replace(/\n/g, "<br>")}</div>
      ${x.figure || ""}
      ${zoneReponse(x)}
      ${alphabet(x)}
      ${calculatrice(x)}
      <div class="duo"><button class="lien nsp" id="passer">Passer (j'y reviendrai)</button><button class="lien nsp" id="rendre">${session.confirmer ? "Sûr ? Touche encore pour rendre" : "Rendre ma copie"}</button></div>
    </section>`;
}

function clicSimulation(b) {
  const x = session.file[0];
  if (b.dataset.calc) return toucheCalc(b.dataset.calc), true;
  if (b.id === "alpha") return basculerAlphabet(), true;
  if (b.id === "rendre") { if (session.confirmer) { finirSimulation(); afficher(); } else { session.confirmer = true; b.textContent = "Sûr ? Touche encore pour rendre"; } return true; }
  if (b.id === "passer") {
    x.ms0 = (x.ms0 || 0) + Date.now() - x.debut; x.debut = null; x.passee = true;   // le temps déjà passé dessus est gardé
    session.file.push(session.file.shift()); session.passees++; session.calc = ""; session.confirmer = false;
    afficher(); return true;
  }
  if (b.dataset.i !== undefined) { x.choisi = +b.dataset.i; afficher(); document.getElementById("verifier")?.focus(); return true; }
  if (b.id !== "verifier" || x.choisi === undefined) return false;
  const i = x.choisi, ms = (x.ms0 || 0) + Date.now() - x.debut, ok = i === x.bonne;
  session.reponses.push({ x, ok, r: i, ms });
  const e = { t: new Date().toISOString(), q: x.id, type: "logique", fam: x.fam, niveau: x.niveau, rep: x.texte ? x.texte[i] : x.choix[i], ok, essai: 1, mode: "simulation", ms, enonce: x.enonce };
  if (x.calc) e.calc = true;
  etat.journal.push(e);
  session.file.shift(); session.calc = ""; session.confirmer = false;
  if (!session.file.length) finirSimulation(); else sauver();
  afficher();
  return true;
}

function finirSimulation() {
  if (session.fini) return;
  const R = session.reponses, parFam = {}, parNiveau = {};
  for (const r of R) { const f = (parFam[r.x.fam] ||= [0, 0]), nv = (parNiveau[r.x.niveau] ||= [0, 0]); f[1]++; nv[1]++; if (r.ok) { f[0]++; nv[0]++; } }
  const justes = R.filter(r => r.ok).length;
  session.bilan = { t: new Date().toISOString(), duree: session.duree, n: session.total, repondues: R.length, justes, ms: Math.min(Date.now(), session.fin) - session.debut, parFam, parNiveau };
  etat.simulations = [...(etat.simulations || []), session.bilan];
  session.justes = justes; session.xp = justes * 5; session.faites = R.length; session.file = [];
  terminerSiVide();   // XP, série du jour, sauvegarde
}

function vueFinSimulation() {
  const b = session.bilan, h = etat.simulations, prec = h.length > 1 ? h[h.length - 2] : null;
  const fams = Object.entries(b.parFam).sort((a, c) => a[1][0] / a[1][1] - c[1][0] / c[1][1]);
  const erreurs = session.reponses.filter(r => !r.ok);
  const choix = (x, i) => x.html ? `<span class="solution">${x.choix[i]}</span>` : esc(x.choix[i]);
  return `
    <section class="card hero">
      <span class="label">Simulation terminée</span>
      <h2>${b.justes} / ${b.n} (${pc(b.justes, b.n)} %)</h2>
      <p>${b.repondues}/${b.n} questions répondues en ${duree(b.ms)}${prec ? ` · la fois d'avant : ${pc(prec.justes, prec.n)} %` : ""}</p>
      ${blocGain()}
      ${blocConcours()}
      ${b.repondues < b.n ? `<div class="piege"><b>${b.n - b.repondues} sans réponse.</b> Le jour J, garde une minute pour répondre à tout : une réponse au hasard a une chance sur quatre, une case vide aucune (sauf si le test enlève des points aux erreurs : à demander à l'école).</div>` : ""}
      <table class="tableau"><thead><tr><th>Famille (de la plus ratée à la plus sûre)</th><th>Justes</th></tr></thead>
        <tbody>${fams.map(([f, [o, n]]) => `<tr><td>${esc(FAMILLES[f].nom)}</td><td>${o}/${n}</td></tr>`).join("")}</tbody></table>
      <p class="note" style="text-align:left;margin:0">Par difficulté : ${Object.entries(b.parNiveau).map(([nv, [o, n]]) => `niveau ${nv} : ${o}/${n}`).join(" · ")}</p>
      <button class="big" id="retour">Retour</button>
    </section>
    ${erreurs.length ? `<section class="card"><span class="label">Tes erreurs, corrigées</span>${erreurs.map(r => `
      <details class="revue"><summary>Question ${r.x.num} · ${esc(FAMILLES[r.x.fam].nom)}</summary>
        <div class="question" style="font-size:1.05rem">${esc(r.x.q).replace(/\n/g, "<br>")}</div>${r.x.figure || ""}
        <p style="margin:0">Ta réponse : ${choix(r.x, r.r)}</p>
        <p style="margin:0"><b>La bonne : ${choix(r.x, r.x.bonne)}</b></p>
        <p style="margin:0">${esc(r.x.pourquoi)}</p>
      </details>`).join("")}</section>` : ""}
    ${carteEnvoi()}`;
}

// ---- Entretien oral (12/11/2026) : questions tirées d'ENTRETIEN.md, réponse à voix haute, auto-évaluation par points clés ----
// Les questions jamais faites et celles ratées la dernière fois sortent plus souvent ; les autres reviennent avec le temps.
const NB_ORAL = 3;
function choisirOral(exclus) {
  return tirerPondere((D.entretien || []).filter(q => !exclus.has(q.id)).map(q => {
    const s = etat.oral[q.id], jours = s ? (Date.now() - Date.parse(s.dernier)) / 864e5 : 30;
    return { q, w: !s ? 4 : (s.dernierOk ? 0 : 3) + 1 + Math.min(jours, 30) / 7 };
  }), 1)[0];
}
const preparerOral = q => ({ ...q, type: "oral", paire: null });

function demarrerOral() {
  const ids = new Set(), file = [];
  for (let i = 0; i < NB_ORAL; i++) { const q = choisirOral(ids); if (!q) break; ids.add(q.id); file.push(preparerOral(q)); }
  session = { mode: "entretien", file, total: file.length, faites: 0, justes: 0, xp: 0, ratees: new Set(), retoursPasses: 0, passees: 0, ids, etape: "repondre", res: null, bilanOral: [] };
  envoi = null;
  afficher();
}

function zoneOral(x) {
  if (session.etape === "repondre") return `<p style="margin:0">Réponds <b>à voix haute</b>, comme devant le jury (visé : environ ${duree(x.duree * 1000)}).</p>
    <textarea id="explication" class="recherche" rows="3" placeholder="Facultatif : note en quelques mots ce que tu as dit. Claude le relira dans ton bilan.">${esc(session.texte || "")}</textarea>
    <button class="big" id="dit">J'ai répondu</button>`;
  const fini = session.etape === "verdict", coches = fini ? session.res.points : [];
  return `${session.texte ? `<div class="item"><span class="label">Tes notes</span><p>${esc(session.texte)}</p></div>` : ""}
    <div class="item"><span class="label">Réponse modèle</span><p${x.lang === "en" ? ' lang="en"' : ""}>${esc(x.modele)}</p></div>
    <span class="label">Coche les points clés que tu as vraiment dits</span>
    <div class="points">${x.points.map((p, i) => `<label><input type="checkbox" data-pt="${i}" ${coches.includes(i) ? "checked" : ""} ${fini ? "disabled" : ""}><span>${esc(p)}</span></label>`).join("")}</div>
    ${fini ? "" : `<button class="big" id="valider-oral">Valider</button>`}`;
}

function finaliserOral() {
  const x = session.file[0], res = session.res;
  session.etape = "verdict";
  if (res.ok) { session.justes++; session.xp += 15; } else session.xp += 5;
  const s = (etat.oral[x.id] ||= { n: 0, ok: 0 });
  s.n++; if (res.ok) s.ok++; s.dernier = new Date().toISOString(); s.dernierOk = res.ok;
  session.bilanOral.push({ x, res });
  const e = { t: s.dernier, q: x.id, type: "oral", mode: "entretien", ok: res.ok, essai: 1, points: res.points, nbPoints: x.points.length, rep: res.rep, ms: res.ms };
  if (session.texte) e.texte = session.texte;
  etat.journal.push(e);
  sauver();
}

function vueFinOral() {
  const a = session.bilanOral.filter(b => !b.res.ok);
  return `
    <section class="card hero">
      <span class="label">Entretien terminé</span>
      <h2>${session.justes} / ${session.total} réponse${session.total > 1 ? "s" : ""} solide${session.total > 1 ? "s" : ""}</h2>
      <p>série de ${etat.serie} jour${etat.serie > 1 ? "s" : ""}</p>
      ${blocGain()}
      ${a.length ? `<div class="piege"><b>À retravailler :</b> ${a.map(b => esc(b.x.q)).join(" · ")}</div>` : ""}
      <p class="note" style="text-align:left;margin:0">Envoie ton bilan : Claude relira tes notes et te fera repasser ces questions à l'oral en séance.</p>
      <button class="big" id="retour">Retour</button>
    </section>
    ${carteEnvoi()}`;
}

function vueFinLogique() {
  const moy = session.faites ? Math.round(session.ms / session.faites / 1000) : 0;
  return `
    <section class="card hero">
      <span class="label">Entraînement terminé</span>
      <h2>${session.justes} / ${session.total} justes</h2>
      <p>${Math.round(100 * session.justes / session.total)} % de réussite · ${moy} s par exercice en moyenne · série de ${etat.serie} jour${etat.serie > 1 ? "s" : ""}</p>
      ${blocGain()}
      ${blocConcours()}
      ${session.changements.length ? `<div class="rappel">${session.changements.map(c => `<span>${esc(c)}</span>`).join("")}</div>` : ""}
      ${session.ratees.size ? `<div class="piege"><b>À retravailler :</b> ${[...session.ratees].map(f => esc(FAMILLES[f].nom)).join(" · ")}. Relis « La méthode » sur l'accueil de la logique.</div>` : ""}
      <button class="big" id="retour">Retour</button>
    </section>
    ${carteEnvoi()}`;
}

function zoneReponse(x) {
  const fini = session.etape === "verdict", res = session.res;
  switch (x.type) {
    case "terminal":
      return `<div class="console">
          <div class="ligne"><span class="invite">${esc(x.invite || "C:\\>")}</span>${res ? `<span style="overflow-wrap:anywhere">${esc(res.rep)}</span>`   /* une fois validée, la commande s'affiche en entier */
            : `<input id="saisie" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="done" aria-label="Commande à taper">`}</div>
          ${fini && x.sortie ? `<pre>${esc(x.sortie)}</pre>` : ""}
        </div>
        ${res ? "" : `<button class="big" id="valider">Entrée ⏎</button>`}`;
    case "oral": return zoneOral(x);
    case "saisie":
      return `<input id="saisie" class="recherche" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="done" placeholder="Ta réponse" ${res ? `value="${esc(res.rep)}" disabled` : ""}>
        ${res ? "" : `<button class="big" id="valider">Valider</button>`}`;
    case "ordre": {
      if (fini) return `<ol class="etapes">${x.etapes.map((e, i) => `<li class="${x.pris[i] === i ? "ok" : "ko"}">${esc(e)}</li>`).join("")}</ol>
        ${res.ok ? "" : `<p class="note" style="text-align:left;margin:0">Ton ordre : ${esc(res.rep)}</p>`}`;
      const reste = x.melange.filter(i => !x.pris.includes(i));
      return `<span class="label">Ton ordre</span>
        <ol class="etapes">${x.pris.length ? x.pris.map((i, k) => `<li><button class="lien" data-retire="${k}" ${res ? "disabled" : ""}>${esc(x.etapes[i])}</button></li>`).join("") : `<li class="vide">Touche les étapes ci-dessous, de la première à la dernière.</li>`}</ol>
        <div class="choix">${reste.map(i => `<button data-pick="${i}">${esc(x.etapes[i])}</button>`).join("")}</div>
        ${res ? "" : `<button class="big" id="valider" ${reste.length ? "disabled" : ""}>Valider cet ordre</button>`}`;
    }
    case "erreur":
      return `<div class="choix">${x.texte.map((m, i) => {
        const cls = fini ? (i === x.faux ? "ok" : i === res.r ? "ko" : "") : (res ? i === res.r : i === x.choisi) ? "sel" : "";
        return `<button data-i="${i}" class="${cls}" ${res ? "disabled" : ""} aria-pressed="${!res && i === x.choisi}">${esc(m)}</button>`; }).join("")}</div>${boutonVerifier(x, res)}`;
    case "associer": {
      const btn = (cote, i, txt) => {
        const trouve = x.trouves.includes(i);
        const cls = trouve ? "ok" : cote === "g" && x.sel === i ? "sel" : cote === "d" && x.flash === i ? "ko" : "";
        return `<button data-${cote}="${i}" class="${cls}" ${trouve || res ? "disabled" : ""}>${esc(txt)}</button>`;
      };
      return `<div class="cols"><div class="choix">${x.gauche.map(i => btn("g", i, x.couples[i][0])).join("")}</div>
        <div class="choix">${x.droite.map(i => btn("d", i, x.couples[i][1])).join("")}</div></div>
        ${x.fautes ? `<p class="note" style="margin:0">${x.fautes} erreur${x.fautes > 1 ? "s" : ""} pour l'instant</p>` : ""}`;
    }
    case "explique":
      if (session.etape === "repondre") return `<textarea id="explication" class="recherche" rows="6" placeholder="Explique avec tes mots, comme à un collègue.">${esc(session.texte || "")}</textarea>
        <button class="big" id="voir">Voir la réponse modèle</button>`;
      return `<div class="item"><span class="label">Ce que tu as écrit</span><p>${esc(session.texte || "(rien)")}</p></div>
        <div class="item"><span class="label">Réponse modèle</span><p>${esc(x.modele)}</p></div>
        ${res ? "" : `<p style="margin:0">Honnêtement, ton explication contenait l'essentiel ?</p>
        <div class="duo"><button class="big ghost" data-auto="0">Il me manquait des choses</button><button class="big" data-auto="1">J'avais l'essentiel</button></div>`}`;
    default:   // qcm, generateur et logique (x.html : les choix sont des dessins SVG produits par l'appli, pas du texte)
      return `<div class="choix${x.html ? " visuel" : ""}">${x.ordreChoix.map(i => {
        const cls = fini ? (i === x.bonne ? "ok" : i === res.r ? "ko" : "") : (res ? i === res.r : i === x.choisi) ? "sel" : "";
        return `<button data-i="${i}" class="${cls}" ${res ? "disabled" : ""} aria-pressed="${!res && i === x.choisi}" ${x.html ? `aria-label="Choix ${i + 1}"` : ""}>${x.html ? x.choix[i] : esc(x.choix[i])}</button>`; }).join("")}</div>${boutonVerifier(x, res)}`;
  }
}

// Choisir puis « Vérifier » (demande d'Arnaud, 12-13/11/2026) : un clic sélectionne, on peut changer d'avis, et seul « Vérifier » valide.
function boutonVerifier(x, res) {
  if (res) return "";
  const simu = session.mode === "simulation";
  return `<button class="big" id="verifier" ${x.choisi === undefined ? "disabled" : ""}>${simu ? "Valider et continuer" : "Vérifier"}</button>`;
}

function solution(x) {
  switch (x.type) {
    case "saisie": return `Réponse attendue : ${x.reponses[0]}`;
    case "terminal": return `Commande attendue : ${x.reponses[0]}`;
    case "oral": { const manque = x.points.filter((_, i) => !session.res.points.includes(i)); return manque.length ? `Points à ajouter la prochaine fois : ${manque.join(" · ")}` : ""; }
    case "erreur": return `Le morceau faux : « ${x.texte[x.faux]} »`;
    case "associer": return x.couples.map(c => `${c[0]} → ${c[1]}`).join(" · ");
    case "logique": return x.html ? `<span class="solution">La bonne réponse : ${x.choix[x.bonne]}</span>` : `La bonne réponse : ${x.choix[x.bonne]}`;
    default: return "";
  }
}

function vueSession() {
  if (session.mode === "simulation") return vueSimulation();
  const x = session.file[0];
  const p = x.paire ? paire(x.paire) : null, logique = session.mode === "logique", oral = session.mode === "entretien";
  const res = session.res;
  const pct = Math.round(100 * session.faites / (logique || oral ? session.total : session.total + session.ratees.size - session.retoursPasses));
  if ((logique || oral) && session.etape === "repondre" && !x.debut) x.debut = Date.now();   // le chrono part quand la question s'affiche
  let bas = "";
  if (session.etape === "repondre") bas = oral ? `<button class="lien nsp" id="passer">Passer cette question</button>`
    : `<div class="duo"><button class="lien nsp" id="nsp">Je ne sais pas</button><button class="lien nsp" id="passer">Passer (pas le temps)</button></div>`;
  else if (session.etape === "confiance") bas = `<p style="margin:0">Avant la correction : tu étais…</p>
    <div class="duo"><button class="big ghost" data-conf="hesite">J'hésitais</button><button class="big" data-conf="sur">Sûr de moi</button></div>`;
  else if (session.etape === "verdict") {
    const titre = oral ? `${res.points.length} point${res.points.length > 1 ? "s" : ""} clé${res.points.length > 1 ? "s" : ""} sur ${x.points.length}${res.ok ? " : réponse solide" : " : à retravailler"}`
      : res.temps ? "Temps écoulé" : res.nsp ? "Pas grave : voici la réponse" : res.ok ? (res.conf === "hesite" ? "Juste, mais tu hésitais" : "Bien vu")
      : res.conf === "sur" ? "Erreur sûre : c'est celle-là qu'il faut retenir" : "Pas tout à fait";
    const sol = res.ok ? "" : solution(x);
    const lim = logique ? FAMILLES[x.fam].limite : 0;
    bas = `<div class="verdict ${res.ok ? "ok" : "ko"}" role="status">
        <h3>${titre}</h3>
        ${sol ? `<p><b>${x.html ? sol : esc(sol)}</b></p>` : ""}
        ${x.pourquoi ? `<p>${esc(x.pourquoi)}</p>` : ""}
        ${logique ? `<p class="note" style="text-align:left;margin:0">Réponse en ${Math.round(res.ms / 1000)} s (objectif du test : moins de ${lim} s).${session.niveauMsg ? ` <b>${esc(session.niveauMsg)}</b>` : ""}</p>` : ""}
        ${oral ? `<p class="note" style="text-align:left;margin:0">Tu as parlé ${duree(res.ms)} (visé : environ ${duree(x.duree * 1000)}).</p>` : ""}
        ${res.ok && res.conf === "hesite" ? `<p class="note" style="text-align:left;margin:0">Elle revient demain : une réponse devinée ne compte pas comme sue.</p>` : ""}
        ${p ? `<div class="rappel">${p.items.map(i => `<span><b>${esc(i.mot)}</b>${i.en ? ` <i class="en-inline">(${esc(i.en)})</i>` : ""} : ${esc(i.image)}</span>`).join("")}</div>` : ""}
      </div>
      <button class="big" id="suite">Continuer</button>`;
  }
  return `
    <div class="progress" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div>
    <section class="card">
      <div class="qhead"><span class="theme">${logique ? `${esc(FAMILLES[x.fam].nom)} · Difficulté ${x.niveau}/${maxNiv(x.fam)}` : oral ? `Entretien · ${esc(x.partie)}` : `${esc(p.theme)} · ${NIVEAUX[niv(x)]}`}</span>${logique || oral ? (session.etape === "repondre" ? `<span class="chrono" id="chrono">${chronoTexte(x)}</span>` : "") : ""}<span class="badges">${logique ? "" : `<span class="qid" title="Numéro à donner à Claude pour signaler cette question">${esc(x.id.toUpperCase())}</span>`}${x.lang === "en" ? `<span class="anglais">English</span>` : ""}${x._retour ? `<span class="retry">Deuxième essai</span>` : x._rappel ? `<span class="retry">Rappel</span>` : ""}</span></div>
      ${x.extrait ? `<pre class="extrait" lang="en">${esc(x.extrait)}</pre>` : ""}
      <div class="question"${x.lang === "en" ? ' lang="en"' : ""}>${esc(x.q).replace(/\n/g, "<br>")}</div>
      ${x.figure || ""}
      ${zoneReponse(x)}
      ${alphabet(x)}
      ${calculatrice(x)}
      ${bas}
    </section>`;
}

// Une réponse est donnée : on demande la confiance (si le format s'y prête), sinon on corrige tout de suite.
function proposer(res) {
  session.res = res;
  session.etape = !res.nsp && AVEC_CONFIANCE.includes(session.file[0].type) ? "confiance" : "verdict";
  if (session.etape === "verdict") finaliser();
  afficher();
  (document.querySelector("[data-conf]") || document.getElementById("suite"))?.focus();
}

function finaliser() {
  if (session.mode === "logique") return finaliserLogique();
  if (session.mode === "entretien") return finaliserOral();
  const x = session.file[0], res = session.res, c = carte(x.id);
  const due = c.due <= jour(), doute = res.conf === "hesite";
  session.etape = "verdict";
  if (res.ok) {
    if (x._retour) session.xp += 5;
    else {
      session.justes++;
      session.xp += doute ? 5 : 10;
      if (doute) c.due = plusJours(1);                                                  // devinée : on la revoit demain, sans monter de boîte
      else if (due) { c.boite = Math.min(c.boite + 1, 5); c.due = plusJours(x.type === "generateur" ? Math.min(INTERVALLES[c.boite], CAP_GENERATEUR) : INTERVALLES[c.boite]); }   // pas encore due (rappel, test aléatoire) : ne monte pas
    }
  } else {
    c.boite = 0; c.due = jour();
    if (!x._retour) { session.ratees.add(x.id); session.file.push(preparer(x._src, true)); }
  }
  etat.cartes[x.id] = c;
  const e = { t: new Date().toISOString(), q: x.id, type: x.type, rep: res.rep, ok: res.ok, essai: x._retour ? 2 : 1, mode: session.mode };
  if (res.r !== undefined) e.r = res.r;
  if (res.conf) e.conf = res.conf;
  if (res.nsp) e.nsp = true;
  if (x.enonce) e.enonce = x.enonce;
  if (x.type === "explique") e.texte = session.texte || "";
  etat.journal.push(e);
  sauver();
}

function suivant() {
  session.file.shift();
  session.faites++;
  session.res = null; session.etape = "repondre"; session.texte = ""; session.niveauMsg = ""; session.calc = "";
  if (session.mode === "logique" && session.faites < session.total) session.file.push(exerciceLogique(choisirFamille(session.derniere)));   // généré au dernier moment : le niveau a pu changer
  terminerSiVide();
  afficher();
  if (!session.fini) document.querySelector("#saisie, #explication")?.focus();
}

function terminerSiVide() {
  if (session.file.length) return;
  const auj = jour(), avant = etat.xp, lignes = [];
  if (session.xp) lignes.push([session.mode === "entretien" ? "Réponses à l'oral" : "Bonnes réponses", session.xp]);
  const taux = session.total ? session.justes / session.total : 0;
  const palier = session.mode !== "entretien" && session.faites ? PALIERS.find(p => taux >= p[0]) : null;
  if (palier) lignes.push([palier[2], palier[1]]);
  if (etat.objectifFait !== auj && faitesAujourdhui() >= OBJECTIF) { etat.objectifFait = auj; lignes.push([`Objectif du jour (${OBJECTIF} questions)`, XP_OBJECTIF]); }
  const total = lignes.reduce((s, l) => s + l[1], 0);
  etat.xp += total;
  const xj = { ...(etat.xpJours || {}) }; xj[auj] = (xj[auj] || 0) + total;
  etat.xpJours = Object.fromEntries(Object.entries(xj).filter(([j]) => j > decaler(auj, -60)));   // deux mois suffisent
  if (session.faites && etat.dernierJour !== auj) { etat.serie = etat.dernierJour === plusJours(-1) ? etat.serie + 1 : 1; etat.dernierJour = auj; }
  etat.recordSerie = Math.max(etat.recordSerie || 0, etat.serie);
  if (session.mode === "logique") session.records = majRecords();
  if (session.mode === "simulation" || (session.mode === "logique" && session.concours && etat.concours)) session.concoursRes = enregistrerConcours();
  session.gain = { avant, apres: etat.xp, lignes, sansFaute: palier?.[0] === 1 };
  if (["logique", "simulation"].includes(session.mode)) {
    const l0 = xpLogique(), gl = lignes.filter(l => !l[0].startsWith("Objectif")).reduce((t, l) => t + l[1], 0);
    etat.xpLogique = l0 + gl;
    session.gain.logique = { avant: l0, apres: etat.xpLogique };
  }
  sauver();
  session.fini = true;
}

function valider() {
  const x = session.file[0];
  if (x.type === "saisie") {
    const v = document.getElementById("saisie").value;
    if (!v.trim()) return;
    proposer({ ok: x.reponses.some(r => norm(r) === norm(v)), rep: v.trim() });
  } else if (x.type === "terminal") {
    const v = document.getElementById("saisie").value;
    if (!v.trim()) return;
    proposer({ ok: x.reponses.some(r => commande(r, x.casse) === commande(v, x.casse)), rep: commande(v, true) });
  } else if (x.type === "ordre") {
    proposer({ ok: x.pris.every((v, k) => v === k), rep: x.pris.map(i => x.etapes[i]).join(" → ") });
  }
}

// Clics pendant une session (renvoie true si le clic a été traité).
function clicSession(b) {
  if (session.mode === "simulation") return clicSimulation(b);
  const x = session.file[0];
  if (b.dataset.calc) return toucheCalc(b.dataset.calc), true;
  if (b.id === "alpha") return basculerAlphabet(), true;
  if (b.id === "suite") return suivant(), true;
  if (session.etape === "auto" && b.id === "valider-oral") {
    const pts = [...document.querySelectorAll("[data-pt]:checked")].map(c => +c.dataset.pt);
    proposer({ ok: pts.length >= Math.ceil(.7 * x.points.length), points: pts, rep: `${pts.length}/${x.points.length} points clés`, ms: x.ms });
    return true;
  }
  if (b.dataset.conf) { session.res.conf = b.dataset.conf; finaliser(); afficher(); document.getElementById("suite")?.focus(); return true; }
  if (session.etape === "repondre") {
    if (b.id === "nsp") { if (x.type === "explique") session.texte = document.getElementById("explication")?.value || ""; proposer({ ok: false, nsp: true, rep: "(je ne sais pas)" }); return true; }
    if (b.id === "passer") return passer(), true;
    if (b.id === "valider") return valider(), true;
    if (b.id === "voir") { session.texte = document.getElementById("explication").value; session.etape = "auto"; afficher(); return true; }
    if (b.id === "dit") { session.texte = document.getElementById("explication").value.trim(); x.ms = Date.now() - x.debut; session.etape = "auto"; afficher(); return true; }
    if (b.dataset.pick !== undefined) { x.pris.push(+b.dataset.pick); afficher(); return true; }
    if (b.dataset.retire !== undefined) { x.pris.splice(+b.dataset.retire, 1); afficher(); return true; }
    if (b.dataset.g !== undefined) { x.sel = +b.dataset.g; x.flash = null; afficher(); return true; }
    if (b.dataset.d !== undefined && x.sel !== null) {
      const j = +b.dataset.d;
      if (j === x.sel) { x.trouves.push(j); x.flash = null; } else { x.fautes++; x.flash = j; }
      x.sel = null;
      if (x.trouves.length === x.couples.length) proposer({ ok: x.fautes === 0, rep: x.fautes ? `${x.fautes} erreur(s)` : "sans faute" });
      else afficher();
      return true;
    }
    if (b.dataset.i !== undefined) { x.choisi = +b.dataset.i; afficher(); document.getElementById("verifier")?.focus(); return true; }
    if (b.id === "verifier" && x.choisi !== undefined) {
      const i = x.choisi;
      if (x.type === "erreur") proposer({ ok: i === x.faux, r: i, rep: x.texte[i] });
      else proposer({ ok: i === x.bonne, r: i, rep: x.choix[i] });
      return true;
    }
  }
  if (session.etape === "auto" && b.dataset.auto) { proposer({ ok: b.dataset.auto === "1", rep: b.dataset.auto === "1" ? "auto-évaluation : l'essentiel" : "auto-évaluation : incomplet" }); return true; }
  return false;
}

function vueFin() {
  if (session.mode === "logique") return vueFinLogique();
  if (session.mode === "simulation") return vueFinSimulation();
  if (session.mode === "entretien") return vueFinOral();
  const ratees = [...session.ratees].map(id => D.questions.find(q => q.id === id));
  return `
    <section class="card hero">
      <span class="label">Session terminée</span>
      <h2>${session.justes} / ${session.total} du premier coup</h2>
      <p>${Math.round(100 * session.justes / session.total)} % de réussite · série de ${etat.serie} jour${etat.serie > 1 ? "s" : ""}</p>
      ${blocGain()}
      ${ratees.length ? `<div class="piege"><b>À retravailler :</b> ${ratees.map(q => esc(paire(q.paire).items.map(i => i.mot).join(" / "))).filter((v, i, a) => a.indexOf(v) === i).join(" · ")}. Elles reviendront dès demain.</div>` : ""}
      <button class="big" id="retour">Retour</button>
    </section>
    ${carteEnvoi()}`;
}

// Recherche insensible à la casse et aux accents : « regle » trouve « règle ».
const sansAccents = s => String(s).normalize("NFD").replace(/\p{Diacritic}/gu, "").toLowerCase();
const textePaire = p => sansAccents([p.theme, p.piege, ...p.items.flatMap(i => [i.mot, i.en || "", i.phrase, i.image])].join(" "));   // on peut chercher en anglais (« gateway » trouve la passerelle)

// Le champ de recherche est rendu une seule fois ; à chaque lettre, seule la liste est remplacée (sinon le champ perdrait le focus et le clavier du téléphone se fermerait).
function vueLexique() {
  const themes = ["Tous", ...new Set(D.paires.map(p => p.theme))];
  return `
    <input type="search" id="recherche" class="recherche" placeholder="Chercher un mot (ex. : passerelle)" aria-label="Chercher dans le lexique" autocomplete="off" enterkeyhint="search" value="${esc(recherche)}">
    <div class="filtres">${themes.map(t => `<button data-f="${esc(t)}" aria-pressed="${t === filtre}">${esc(t)}</button>`).join("")}</div>
    <div id="liste-lexique">${listeLexique()}</div>`;
}

function listeLexique() {
  const mots = sansAccents(recherche).split(/\s+/).filter(Boolean);
  const liste = D.paires.filter(p => (filtre === "Tous" || p.theme === filtre) && mots.every(m => textePaire(p).includes(m)));
  if (!liste.length) return `<p class="note">Aucune paire ne contient « ${esc(recherche)} »${filtre === "Tous" ? "" : ` dans le thème ${esc(filtre)}`}.</p>`;
  return `${mots.length ? `<p class="note">${liste.length} paire${liste.length > 1 ? "s" : ""} trouvée${liste.length > 1 ? "s" : ""}</p>` : ""}
    ${liste.map(p => `
      <section class="card paire">
        <span class="label">${esc(p.theme)} · ne pas confondre</span>
        <h3>${esc(p.items.map(i => i.mot).join(" / "))}</h3>
        <div class="items">${p.items.map(i => `
          <div class="item"><span class="mot">${esc(i.mot)}</span>${i.en ? `<span class="en">🇬🇧 ${esc(i.en)}</span>` : ""}<p>${esc(i.phrase)}</p><p class="img">${esc(i.image)}</p></div>`).join("")}</div>
        <div class="piege"><b>Le piège :</b> ${esc(p.piege)}</div>
      </section>`).join("")}`;
}

function afficher() {
  chips();
  document.getElementById("tab-reviser").setAttribute("aria-selected", onglet === "reviser");
  document.getElementById("tab-lexique").setAttribute("aria-selected", onglet === "lexique");
  document.getElementById("tab-logique").setAttribute("aria-selected", onglet === "logique");
  const v = document.getElementById("vue");
  if (onglet === "lexique") { v.innerHTML = vueLexique(); v.style.display = "grid"; v.style.gap = "14px"; return; }
  v.style.display = "grid"; v.style.gap = "16px";
  // Une session n'est affichée que dans son propre onglet (Réviser ou Logique).
  const s = session && (onglet === "logique") === ["logique", "simulation"].includes(session.mode) ? session : null;
  v.innerHTML = s ? (s.fini ? vueFin() : vueSession()) : onglet === "logique" ? vueLogique() : accueil();
  if (s?.fini) animerGain();
}

document.getElementById("vue").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.detail) ouvrirDetail(b.dataset.detail);
  else if (b.id === "go") demarrer(false);
  else if (b.id === "bonus") demarrer(true);
  else if (b.id === "go-cible") demarrer("cible");
  else if (b.dataset.cible) { const c = ciblees(), i = c.indexOf(b.dataset.cible); i < 0 ? c.push(b.dataset.cible) : c.splice(i, 1); etat.ciblees = c; sauver(); afficher(); }
  else if (b.id === "cible-vider") { etat.ciblees = []; sauver(); afficher(); }
  else if (b.id === "go-logique") demarrerLogique();
  else if (b.id === "go-simu") demarrerSimulation();
  else if (b.id === "go-oral") demarrerOral();
  else if (b.dataset.simu) { etat.simuDuree = +b.dataset.simu; sauver(); afficher(); }
  else if (b.id === "calc-option") { etat.calc = !etat.calc; sauver(); afficher(); }
  else if (b.dataset.taille) { etat[b.dataset.cle] = +b.dataset.taille; sauver(); afficher(); }
  else if (b.dataset.fam) { etat.famLogique = b.dataset.fam; sauver(); afficher(); }
  else if (b.id === "concours") { etat.concours = !etat.concours; sauver(); afficher(); }
  else if (b.dataset.seuil) { etat.seuilConcours = +b.dataset.seuil; sauver(); afficher(); }
  else if (session && !session.fini && clicSession(b)) return;
  else if (b.id === "retour") { session = null; afficher(); }
  else if (b.id === "envoyer") envoyer();
  else if (b.id === "idee-ajout") ajouterIdee();
  else if (b.dataset.ideeSuppr !== undefined) { etat.idees.splice(+b.dataset.ideeSuppr, 1); sauver(); afficher(); }
  else if (b.dataset.f) { filtre = b.dataset.f; afficher(); }
});
document.getElementById("vue").addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.id === "saisie" && session && session.etape === "repondre") { e.preventDefault(); valider(); }
});
document.getElementById("vue").addEventListener("input", e => {
  if (e.target.id !== "recherche") return;
  recherche = e.target.value;
  document.getElementById("liste-lexique").innerHTML = listeLexique();
});
document.getElementById("chips").addEventListener("click", e => { const b = e.target.closest("[data-detail]"); if (b && D) ouvrirDetail(b.dataset.detail); });
document.getElementById("detail").addEventListener("click", e => { if (e.target.id === "detail") e.target.close(); });   // toucher le fond ferme la fenêtre
document.getElementById("tab-reviser").addEventListener("click", () => { onglet = "reviser"; afficher(); });
document.getElementById("tab-lexique").addEventListener("click", () => { onglet = "lexique"; afficher(); });
document.getElementById("tab-logique").addEventListener("click", () => { onglet = "logique"; afficher(); });

// Chrono de la logique : seul le compteur est mis à jour chaque seconde ; en mode concours, le temps écoulé compte comme une erreur.
// Simulation : un seul chrono pour tout le test ; quand il tombe à zéro, la copie est rendue (même si on est sur un autre onglet).
// Entretien oral : le chrono montre le temps de parole.
setInterval(() => {
  if (!session || session.fini) return;
  if (session.mode === "simulation") {
    if (Date.now() >= session.fin) { finirSimulation(); return afficher(); }
    const c = document.getElementById("chrono-simu"); if (c) c.textContent = resteSimu();
    return;
  }
  if (!["logique", "entretien"].includes(session.mode) || session.etape !== "repondre") return;
  const x = session.file[0]; if (!x || !x.debut) return;
  if (session.mode === "logique" && onglet === "logique" && etat.concours && Date.now() - x.debut >= FAMILLES[x.fam].limite * 1000) return proposer({ ok: false, temps: true, rep: "(temps écoulé)" });
  const c = document.getElementById("chrono"); if (c) c.textContent = chronoTexte(x);
}, 1000);

fetch("memo-cyber.json", { cache: "no-store" })
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(d => {
    D = d;
    // La logique a son propre onglet (exercices générés, avec chrono) : ses cartes sortent des révisions.
    D.questions = D.questions.filter(q => paire(q.paire)?.theme !== "Logique");
    document.getElementById("note").textContent = (stockage ? "Ta progression reste enregistrée sur cet appareil." : "Ta progression ne peut pas être enregistrée ici (navigation privée ?).") + ` Cartes mises à jour le ${new Date(d.maj + "T12:00:00").toLocaleDateString("fr-FR")}.`;
    afficher();
  })
  .catch(e => { document.getElementById("vue").innerHTML = `<section class="card"><p class="err">Impossible de charger les cartes (${esc(e.message)}). Il faut republier le mémo avec memo-cyber.json.</p></section>`; });
</script>

<script>
// Installation hors ligne ; quand une nouvelle version arrive, la page se recharge une fois d'elle-même.
if ("serviceWorker" in navigator && location.protocol !== "file:") {
  var dejaControlee = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener("controllerchange", function () { if (dejaControlee) location.reload(); });
  navigator.serviceWorker.register("sw.js").catch(function () {});
}
</script>
