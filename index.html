        <span><b>Figures</b> : comme les matrices, une chose à la fois : la flèche (de combien elle tourne ?), le nombre de côtés, le remplissage.</span>
        <span><b>L'intrus</b> : cherche ce que les autres ont en commun (pair, multiple de…, carré, premier), puis celui qui n'en est pas.</span>
        <span><b>Analogies</b> : dis la relation avec une phrase (« le double », « l'outil de… »), puis applique la même phrase à l'autre.</span>
        <span><b>Le jour du test</b> : une question bloque ? Passe et reviens-y : elles valent toutes autant de points.</span>
      </div>
    </section>
    ${carteEnvoi()}`;
}

// ---- Simulation de test (12/11/2026) : comme le jour J, pour mesurer la progression jusqu'au test de mars 2027 ----
// Toutes les familles mélangées (jamais deux fois la même d'affilée), difficulté qui monte par tiers (niveau 1, puis 2, puis 3),
// un seul chrono, aucune correction avant la fin. Une question passée revient à la fin. Les niveaux adaptatifs de l'entraînement ne bougent pas.
const SIMU = { 30: 40, 45: 60 };   // durée en minutes → nombre de questions (environ 45 s par question)
const resteSimu = () => { const s = Math.max(0, Math.ceil((session.fin - Date.now()) / 1000)); return `⏱ ${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; };
const pc = (a, n) => n ? Math.round(100 * a / n) : 0;

function carteSimulation() {
  const d = SIMU[etat.simuDuree] ? etat.simuDuree : 30, h = etat.simulations || [];
  return `
    <section class="card">
      <span class="label">Simulation de test</span>
      <h2 style="font-size:1.3rem">Le jour J, en vrai</h2>
      <p style="margin:0">Toutes les familles mélangées, une difficulté qui monte, un seul chrono pour tout le test et aucune correction avant la fin. Une question te bloque ? Passe : elle revient à la fin s'il reste du temps.</p>
      <div class="segment" style="grid-template-columns:1fr 1fr" role="group" aria-label="Durée de la simulation">${Object.entries(SIMU).map(([m, n]) =>
        `<button data-simu="${m}" aria-pressed="${d === +m}">${m} min · ${n} questions</button>`).join("")}</div>
      <button class="big" id="go-simu">Lancer la simulation</button>
      ${h.length ? `<table class="tableau"><thead><tr><th>Date</th><th>Durée</th><th>Score</th><th>Répondues</th></tr></thead>
        <tbody>${h.slice(-6).reverse().map(s => `<tr><td>${new Date(s.t).toLocaleDateString("fr-FR")}</td><td>${s.duree} min</td><td><b>${s.justes}/${s.n}</b> (${pc(s.justes, s.n)} %)</td><td>${s.repondues}/${s.n}</td></tr>`).join("")}</tbody></table>
        <p class="note" style="text-align:left;margin:0">Meilleur score : ${Math.max(...h.map(s => pc(s.justes, s.n)))} % · ${h.length} simulation${h.length > 1 ? "s" : ""} en tout.</p>`
        : `<p class="note" style="text-align:left;margin:0">Ton historique apparaîtra ici, pour mesurer ta progression jusqu'au test de mars.</p>`}
    </section>`;
}

function demarrerSimulation() {
  const d = SIMU[etat.simuDuree] ? etat.simuDuree : 30, n = SIMU[d], fams = Object.keys(FAMILLES), ordre = [];
  while (ordre.length < n) { const tour = melanger([...fams]); if (tour[0] === ordre[ordre.length - 1]) tour.push(tour.shift()); ordre.push(...tour); }
  const file = ordre.slice(0, n).map((f, i) => ({ ...exerciceLogique(f, 1 + Math.floor(3 * i / n)), num: i + 1 }));
  session = { mode: "simulation", file, total: n, duree: d, debut: Date.now(), fin: Date.now() + d * 60000, reponses: [], passees: 0,
              etape: "repondre", res: null, faites: 0, justes: 0, xp: 0, ratees: new Set(), retoursPasses: 0, ids: new Set(), calc: "" };
  envoi = null;
  afficher();
}

function vueSimulation() {
  const x = session.file[0];
  if (!x.debut) x.debut = Date.now();
  const pct = pc(session.reponses.length, session.total);
  return `
    <div class="progress" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div>
    <section class="card">
      <div class="qhead"><span class="theme">Question ${x.num} / ${session.total}${x.passee ? " · tu l'avais passée" : ""}</span><span class="chrono" id="chrono-simu">${resteSimu()}</span></div>
      <div class="question">${esc(x.q).replace(/\n/g, "<br>")}</div>
      ${x.figure || ""}
      ${zoneReponse(x)}
      ${calculatrice(x)}
      <div class="duo"><button class="lien nsp" id="passer">Passer (j'y reviendrai)</button><button class="lien nsp" id="rendre">${session.confirmer ? "Sûr ? Touche encore pour rendre" : "Rendre ma copie"}</button></div>
    </section>`;
}

function clicSimulation(b) {
  const x = session.file[0];
  if (b.dataset.calc) return toucheCalc(b.dataset.calc), true;
  if (b.id === "rendre") { if (session.confirmer) { finirSimulation(); afficher(); } else { session.confirmer = true; b.textContent = "Sûr ? Touche encore pour rendre"; } return true; }
  if (b.id === "passer") {
    x.ms0 = (x.ms0 || 0) + Date.now() - x.debut; x.debut = null; x.passee = true;   // le temps déjà passé dessus est gardé
    session.file.push(session.file.shift()); session.passees++; session.calc = ""; session.confirmer = false;
    afficher(); return true;
  }
  if (b.dataset.i === undefined) return false;
  const i = +b.dataset.i, ms = (x.ms0 || 0) + Date.now() - x.debut, ok = i === x.bonne;
  session.reponses.push({ x, ok, r: i, ms });
  const e = { t: new Date().toISOString(), q: x.id, type: "logique", fam: x.fam, niveau: x.niveau, rep: x.texte ? x.texte[i] : x.choix[i], ok, essai: 1, mode: "simulation", ms, enonce: x.enonce };
  if (x.calc) e.calc = true;
  etat.journal.push(e);
  session.file.shift(); session.calc = ""; session.confirmer = false;
  if (!session.file.length) finirSimulation(); else sauver();
  afficher();
  return true;
}

function finirSimulation() {
  if (session.fini) return;
  const R = session.reponses, parFam = {}, parNiveau = {};
  for (const r of R) { const f = (parFam[r.x.fam] ||= [0, 0]), nv = (parNiveau[r.x.niveau] ||= [0, 0]); f[1]++; nv[1]++; if (r.ok) { f[0]++; nv[0]++; } }
  const justes = R.filter(r => r.ok).length;
  session.bilan = { t: new Date().toISOString(), duree: session.duree, n: session.total, repondues: R.length, justes, ms: Math.min(Date.now(), session.fin) - session.debut, parFam, parNiveau };
  etat.simulations = [...(etat.simulations || []), session.bilan];
  session.justes = justes; session.xp = justes * 5; session.faites = R.length; session.file = [];
  terminerSiVide();   // XP, série du jour, sauvegarde
}

function vueFinSimulation() {
  const b = session.bilan, h = etat.simulations, prec = h.length > 1 ? h[h.length - 2] : null;
  const fams = Object.entries(b.parFam).sort((a, c) => a[1][0] / a[1][1] - c[1][0] / c[1][1]);
  const erreurs = session.reponses.filter(r => !r.ok);
  const choix = (x, i) => x.html ? `<span class="solution">${x.choix[i]}</span>` : esc(x.choix[i]);
  return `
    <section class="card hero">
      <span class="label">Simulation terminée</span>
      <h2>${b.justes} / ${b.n} (${pc(b.justes, b.n)} %)</h2>
      <p>${b.repondues}/${b.n} questions répondues en ${duree(b.ms)}${prec ? ` · la fois d'avant : ${pc(prec.justes, prec.n)} %` : ""} · +${session.xp} XP</p>
      ${b.repondues < b.n ? `<div class="piege"><b>${b.n - b.repondues} sans réponse.</b> Le jour J, garde une minute pour répondre à tout : une réponse au hasard a une chance sur quatre, une case vide aucune (sauf si le test enlève des points aux erreurs : à demander à l'école).</div>` : ""}
      <table class="tableau"><thead><tr><th>Famille (de la plus ratée à la plus sûre)</th><th>Justes</th></tr></thead>
        <tbody>${fams.map(([f, [o, n]]) => `<tr><td>${esc(FAMILLES[f].nom)}</td><td>${o}/${n}</td></tr>`).join("")}</tbody></table>
      <p class="note" style="text-align:left;margin:0">Par difficulté : ${Object.entries(b.parNiveau).map(([nv, [o, n]]) => `niveau ${nv} : ${o}/${n}`).join(" · ")}</p>
      <button class="big" id="retour">Retour</button>
    </section>
    ${erreurs.length ? `<section class="card"><span class="label">Tes erreurs, corrigées</span>${erreurs.map(r => `
      <details class="revue"><summary>Question ${r.x.num} · ${esc(FAMILLES[r.x.fam].nom)}</summary>
        <div class="question" style="font-size:1.05rem">${esc(r.x.q).replace(/\n/g, "<br>")}</div>${r.x.figure || ""}
        <p style="margin:0">Ta réponse : ${choix(r.x, r.r)}</p>
        <p style="margin:0"><b>La bonne : ${choix(r.x, r.x.bonne)}</b></p>
        <p style="margin:0">${esc(r.x.pourquoi)}</p>
      </details>`).join("")}</section>` : ""}
    ${carteEnvoi()}`;
}

// ---- Entretien oral (12/11/2026) : questions tirées d'ENTRETIEN.md, réponse à voix haute, auto-évaluation par points clés ----
// Les questions jamais faites et celles ratées la dernière fois sortent plus souvent ; les autres reviennent avec le temps.
const NB_ORAL = 3;
function choisirOral(exclus) {
  return tirerPondere((D.entretien || []).filter(q => !exclus.has(q.id)).map(q => {
    const s = etat.oral[q.id], jours = s ? (Date.now() - Date.parse(s.dernier)) / 864e5 : 30;
    return { q, w: !s ? 4 : (s.dernierOk ? 0 : 3) + 1 + Math.min(jours, 30) / 7 };
  }), 1)[0];
}
const preparerOral = q => ({ ...q, type: "oral", paire: null });

function demarrerOral() {
  const ids = new Set(), file = [];
  for (let i = 0; i < NB_ORAL; i++) { const q = choisirOral(ids); if (!q) break; ids.add(q.id); file.push(preparerOral(q)); }
  session = { mode: "entretien", file, total: file.length, faites: 0, justes: 0, xp: 0, ratees: new Set(), retoursPasses: 0, passees: 0, ids, etape: "repondre", res: null, bilanOral: [] };
  envoi = null;
  afficher();
}

function zoneOral(x) {
  if (session.etape === "repondre") return `<p style="margin:0">Réponds <b>à voix haute</b>, comme devant le jury (visé : environ ${duree(x.duree * 1000)}).</p>
    <textarea id="explication" class="recherche" rows="3" placeholder="Facultatif : note en quelques mots ce que tu as dit. Claude le relira dans ton bilan.">${esc(session.texte || "")}</textarea>
    <button class="big" id="dit">J'ai répondu</button>`;
  const fini = session.etape === "verdict", coches = fini ? session.res.points : [];
  return `${session.texte ? `<div class="item"><span class="label">Tes notes</span><p>${esc(session.texte)}</p></div>` : ""}
    <div class="item"><span class="label">Réponse modèle</span><p${x.lang === "en" ? ' lang="en"' : ""}>${esc(x.modele)}</p></div>
    <span class="label">Coche les points clés que tu as vraiment dits</span>
    <div class="points">${x.points.map((p, i) => `<label><input type="checkbox" data-pt="${i}" ${coches.includes(i) ? "checked" : ""} ${fini ? "disabled" : ""}><span>${esc(p)}</span></label>`).join("")}</div>
    ${fini ? "" : `<button class="big" id="valider-oral">Valider</button>`}`;
}

function finaliserOral() {
  const x = session.file[0], res = session.res;
  session.etape = "verdict";
  if (res.ok) { session.justes++; session.xp += 15; } else session.xp += 5;
  const s = (etat.oral[x.id] ||= { n: 0, ok: 0 });
  s.n++; if (res.ok) s.ok++; s.dernier = new Date().toISOString(); s.dernierOk = res.ok;
  session.bilanOral.push({ x, res });
  const e = { t: s.dernier, q: x.id, type: "oral", mode: "entretien", ok: res.ok, essai: 1, points: res.points, nbPoints: x.points.length, rep: res.rep, ms: res.ms };
  if (session.texte) e.texte = session.texte;
  etat.journal.push(e);
  sauver();
}

function vueFinOral() {
  const a = session.bilanOral.filter(b => !b.res.ok);
  return `
    <section class="card hero">
      <span class="label">Entretien terminé</span>
      <h2>${session.justes} / ${session.total} réponse${session.total > 1 ? "s" : ""} solide${session.total > 1 ? "s" : ""}</h2>
      <p>+${session.xp} XP · série de ${etat.serie} jour${etat.serie > 1 ? "s" : ""}</p>
      ${a.length ? `<div class="piege"><b>À retravailler :</b> ${a.map(b => esc(b.x.q)).join(" · ")}</div>` : ""}
      <p class="note" style="text-align:left;margin:0">Envoie ton bilan : Claude relira tes notes et te fera repasser ces questions à l'oral en séance.</p>
      <button class="big" id="retour">Retour</button>
    </section>
    ${carteEnvoi()}`;
}

function vueFinLogique() {
  const moy = session.faites ? Math.round(session.ms / session.faites / 1000) : 0;
  return `
    <section class="card hero">
      <span class="label">Entraînement terminé</span>
      <h2>${session.justes} / ${session.total} justes</h2>
      <p>${moy} s par exercice en moyenne · +${session.xp} XP · série de ${etat.serie} jour${etat.serie > 1 ? "s" : ""}</p>
      ${session.changements.length ? `<div class="rappel">${session.changements.map(c => `<span>${esc(c)}</span>`).join("")}</div>` : ""}
      ${session.ratees.size ? `<div class="piege"><b>À retravailler :</b> ${[...session.ratees].map(f => esc(FAMILLES[f].nom)).join(" · ")}. Relis « La méthode » sur l'accueil de la logique.</div>` : ""}
      <button class="big" id="retour">Retour</button>
    </section>
    ${carteEnvoi()}`;
}

function zoneReponse(x) {
  const fini = session.etape === "verdict", res = session.res;
  switch (x.type) {
    case "terminal":
      return `<div class="console">
          <div class="ligne"><span class="invite">${esc(x.invite || "C:\\>")}</span>${res ? `<span style="overflow-wrap:anywhere">${esc(res.rep)}</span>`   /* une fois validée, la commande s'affiche en entier */
            : `<input id="saisie" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="done" aria-label="Commande à taper">`}</div>
          ${fini && x.sortie ? `<pre>${esc(x.sortie)}</pre>` : ""}
        </div>
        ${res ? "" : `<button class="big" id="valider">Entrée ⏎</button>`}`;
    case "oral": return zoneOral(x);
    case "saisie":
      return `<input id="saisie" class="recherche" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="done" placeholder="Ta réponse" ${res ? `value="${esc(res.rep)}" disabled` : ""}>
        ${res ? "" : `<button class="big" id="valider">Valider</button>`}`;
    case "ordre": {
      if (fini) return `<ol class="etapes">${x.etapes.map((e, i) => `<li class="${x.pris[i] === i ? "ok" : "ko"}">${esc(e)}</li>`).join("")}</ol>
        ${res.ok ? "" : `<p class="note" style="text-align:left;margin:0">Ton ordre : ${esc(res.rep)}</p>`}`;
      const reste = x.melange.filter(i => !x.pris.includes(i));
      return `<span class="label">Ton ordre</span>
        <ol class="etapes">${x.pris.length ? x.pris.map((i, k) => `<li><button class="lien" data-retire="${k}" ${res ? "disabled" : ""}>${esc(x.etapes[i])}</button></li>`).join("") : `<li class="vide">Touche les étapes ci-dessous, de la première à la dernière.</li>`}</ol>
        <div class="choix">${reste.map(i => `<button data-pick="${i}">${esc(x.etapes[i])}</button>`).join("")}</div>
        ${res ? "" : `<button class="big" id="valider" ${reste.length ? "disabled" : ""}>Valider cet ordre</button>`}`;
    }
    case "erreur":
      return `<div class="choix">${x.texte.map((m, i) => {
        const cls = fini ? (i === x.faux ? "ok" : i === res.r ? "ko" : "") : res && i === res.r ? "sel" : "";
        return `<button data-i="${i}" class="${cls}" ${res ? "disabled" : ""}>${esc(m)}</button>`; }).join("")}</div>`;
    case "associer": {
      const btn = (cote, i, txt) => {
        const trouve = x.trouves.includes(i);
        const cls = trouve ? "ok" : cote === "g" && x.sel === i ? "sel" : cote === "d" && x.flash === i ? "ko" : "";
        return `<button data-${cote}="${i}" class="${cls}" ${trouve || res ? "disabled" : ""}>${esc(txt)}</button>`;
      };
      return `<div class="cols"><div class="choix">${x.gauche.map(i => btn("g", i, x.couples[i][0])).join("")}</div>
        <div class="choix">${x.droite.map(i => btn("d", i, x.couples[i][1])).join("")}</div></div>
        ${x.fautes ? `<p class="note" style="margin:0">${x.fautes} erreur${x.fautes > 1 ? "s" : ""} pour l'instant</p>` : ""}`;
    }
    case "explique":
      if (session.etape === "repondre") return `<textarea id="explication" class="recherche" rows="6" placeholder="Explique avec tes mots, comme à un collègue.">${esc(session.texte || "")}</textarea>
        <button class="big" id="voir">Voir la réponse modèle</button>`;
      return `<div class="item"><span class="label">Ce que tu as écrit</span><p>${esc(session.texte || "(rien)")}</p></div>
        <div class="item"><span class="label">Réponse modèle</span><p>${esc(x.modele)}</p></div>
        ${res ? "" : `<p style="margin:0">Honnêtement, ton explication contenait l'essentiel ?</p>
        <div class="duo"><button class="big ghost" data-auto="0">Il me manquait des choses</button><button class="big" data-auto="1">J'avais l'essentiel</button></div>`}`;
    default:   // qcm, generateur et logique (x.html : les choix sont des dessins SVG produits par l'appli, pas du texte)
      return `<div class="choix${x.html ? " visuel" : ""}">${x.ordreChoix.map(i => {
        const cls = fini ? (i === x.bonne ? "ok" : i === res.r ? "ko" : "") : res && i === res.r ? "sel" : "";
        return `<button data-i="${i}" class="${cls}" ${res ? "disabled" : ""} ${x.html ? `aria-label="Choix ${i + 1}"` : ""}>${x.html ? x.choix[i] : esc(x.choix[i])}</button>`; }).join("")}</div>`;
  }
}

function solution(x) {
  switch (x.type) {
    case "saisie": return `Réponse attendue : ${x.reponses[0]}`;
    case "terminal": return `Commande attendue : ${x.reponses[0]}`;
    case "oral": { const manque = x.points.filter((_, i) => !session.res.points.includes(i)); return manque.length ? `Points à ajouter la prochaine fois : ${manque.join(" · ")}` : ""; }
    case "erreur": return `Le morceau faux : « ${x.texte[x.faux]} »`;
    case "associer": return x.couples.map(c => `${c[0]} → ${c[1]}`).join(" · ");
    case "logique": return x.html ? `<span class="solution">La bonne réponse : ${x.choix[x.bonne]}</span>` : `La bonne réponse : ${x.choix[x.bonne]}`;
    default: return "";
  }
}

function vueSession() {
  if (session.mode === "simulation") return vueSimulation();
  const x = session.file[0];
  const p = x.paire ? paire(x.paire) : null, logique = session.mode === "logique", oral = session.mode === "entretien";
  const res = session.res;
  const pct = Math.round(100 * session.faites / (logique || oral ? session.total : session.total + session.ratees.size - session.retoursPasses));
  if ((logique || oral) && session.etape === "repondre" && !x.debut) x.debut = Date.now();   // le chrono part quand la question s'affiche
  let bas = "";
  if (session.etape === "repondre") bas = oral ? `<button class="lien nsp" id="passer">Passer cette question</button>`
    : `<div class="duo"><button class="lien nsp" id="nsp">Je ne sais pas</button><button class="lien nsp" id="passer">Passer (pas le temps)</button></div>`;
  else if (session.etape === "confiance") bas = `<p style="margin:0">Avant la correction : tu étais…</p>
    <div class="duo"><button class="big ghost" data-conf="hesite">J'hésitais</button><button class="big" data-conf="sur">Sûr de moi</button></div>`;
  else if (session.etape === "verdict") {
    const titre = oral ? `${res.points.length} point${res.points.length > 1 ? "s" : ""} clé${res.points.length > 1 ? "s" : ""} sur ${x.points.length}${res.ok ? " : réponse solide" : " : à retravailler"}`
      : res.temps ? "Temps écoulé" : res.nsp ? "Pas grave : voici la réponse" : res.ok ? (res.conf === "hesite" ? "Juste, mais tu hésitais" : "Bien vu")
      : res.conf === "sur" ? "Erreur sûre : c'est celle-là qu'il faut retenir" : "Pas tout à fait";
    const sol = res.ok ? "" : solution(x);
    const lim = logique ? FAMILLES[x.fam].limite : 0;
    bas = `<div class="verdict ${res.ok ? "ok" : "ko"}" role="status">
        <h3>${titre}</h3>
        ${sol ? `<p><b>${x.html ? sol : esc(sol)}</b></p>` : ""}
        ${x.pourquoi ? `<p>${esc(x.pourquoi)}</p>` : ""}
        ${logique ? `<p class="note" style="text-align:left;margin:0">Réponse en ${Math.round(res.ms / 1000)} s (objectif du test : moins de ${lim} s).${session.niveauMsg ? ` <b>${esc(session.niveauMsg)}</b>` : ""}</p>` : ""}
        ${oral ? `<p class="note" style="text-align:left;margin:0">Tu as parlé ${duree(res.ms)} (visé : environ ${duree(x.duree * 1000)}).</p>` : ""}
        ${res.ok && res.conf === "hesite" ? `<p class="note" style="text-align:left;margin:0">Elle revient demain : une réponse devinée ne compte pas comme sue.</p>` : ""}
        ${p ? `<div class="rappel">${p.items.map(i => `<span><b>${esc(i.mot)}</b>${i.en ? ` <i class="en-inline">(${esc(i.en)})</i>` : ""} : ${esc(i.image)}</span>`).join("")}</div>` : ""}
      </div>
      <button class="big" id="suite">Continuer</button>`;
  }
  return `
    <div class="progress" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div>
    <section class="card">
      <div class="qhead"><span class="theme">${logique ? `${esc(FAMILLES[x.fam].nom)} · Difficulté ${x.niveau}/3` : oral ? `Entretien · ${esc(x.partie)}` : `${esc(p.theme)} · ${NIVEAUX[niv(x)]}`}</span>${logique || oral ? (session.etape === "repondre" ? `<span class="chrono" id="chrono">${chronoTexte(x)}</span>` : "") : ""}<span class="badges">${x.lang === "en" ? `<span class="anglais">English</span>` : ""}${x._retour ? `<span class="retry">Deuxième essai</span>` : x._rappel ? `<span class="retry">Rappel</span>` : ""}</span></div>
      ${x.extrait ? `<pre class="extrait" lang="en">${esc(x.extrait)}</pre>` : ""}
      <div class="question"${x.lang === "en" ? ' lang="en"' : ""}>${esc(x.q).replace(/\n/g, "<br>")}</div>
      ${x.figure || ""}
      ${zoneReponse(x)}
      ${calculatrice(x)}
      ${bas}
    </section>`;
}

// Une réponse est donnée : on demande la confiance (si le format s'y prête), sinon on corrige tout de suite.
function proposer(res) {
  session.res = res;
  session.etape = !res.nsp && AVEC_CONFIANCE.includes(session.file[0].type) ? "confiance" : "verdict";
  if (session.etape === "verdict") finaliser();
  afficher();
  (document.querySelector("[data-conf]") || document.getElementById("suite"))?.focus();
}

function finaliser() {
  if (session.mode === "logique") return finaliserLogique();
  if (session.mode === "entretien") return finaliserOral();
  const x = session.file[0], res = session.res, c = carte(x.id);
  const due = c.due <= jour(), doute = res.conf === "hesite";
  session.etape = "verdict";
  if (res.ok) {
    if (x._retour) session.xp += 5;
    else {
      session.justes++;
      session.xp += doute ? 5 : 10;
      if (doute) c.due = plusJours(1);                                                  // devinée : on la revoit demain, sans monter de boîte
      else if (due) { c.boite = Math.min(c.boite + 1, 5); c.due = plusJours(x.type === "generateur" ? Math.min(INTERVALLES[c.boite], CAP_GENERATEUR) : INTERVALLES[c.boite]); }   // pas encore due (rappel, test aléatoire) : ne monte pas
    }
  } else {
    c.boite = 0; c.due = jour();
    if (!x._retour) { session.ratees.add(x.id); session.file.push(preparer(x._src, true)); }
  }
  etat.cartes[x.id] = c;
  const e = { t: new Date().toISOString(), q: x.id, type: x.type, rep: res.rep, ok: res.ok, essai: x._retour ? 2 : 1, mode: session.mode };
  if (res.r !== undefined) e.r = res.r;
  if (res.conf) e.conf = res.conf;
  if (res.nsp) e.nsp = true;
  if (x.enonce) e.enonce = x.enonce;
  if (x.type === "explique") e.texte = session.texte || "";
  etat.journal.push(e);
  sauver();
}

function suivant() {
  session.file.shift();
  session.faites++;
  session.res = null; session.etape = "repondre"; session.texte = ""; session.niveauMsg = ""; session.calc = "";
  if (session.mode === "logique" && session.faites < session.total) session.file.push(exerciceLogique(choisirFamille(session.derniere)));   // généré au dernier moment : le niveau a pu changer
  terminerSiVide();
  afficher();
  if (!session.fini) document.querySelector("#saisie, #explication")?.focus();
}

function terminerSiVide() {
  if (session.file.length) return;
  etat.xp += session.xp;
  const auj = jour();
  if (session.faites && etat.dernierJour !== auj) { etat.serie = etat.dernierJour === plusJours(-1) ? etat.serie + 1 : 1; etat.dernierJour = auj; }
  sauver();
  session.fini = true;
}

function valider() {
  const x = session.file[0];
  if (x.type === "saisie") {
    const v = document.getElementById("saisie").value;
    if (!v.trim()) return;
    proposer({ ok: x.reponses.some(r => norm(r) === norm(v)), rep: v.trim() });
  } else if (x.type === "terminal") {
    const v = document.getElementById("saisie").value;
    if (!v.trim()) return;
    proposer({ ok: x.reponses.some(r => commande(r, x.casse) === commande(v, x.casse)), rep: commande(v, true) });
  } else if (x.type === "ordre") {
    proposer({ ok: x.pris.every((v, k) => v === k), rep: x.pris.map(i => x.etapes[i]).join(" → ") });
  }
}

// Clics pendant une session (renvoie true si le clic a été traité).
function clicSession(b) {
  if (session.mode === "simulation") return clicSimulation(b);
  const x = session.file[0];
  if (b.dataset.calc) return toucheCalc(b.dataset.calc), true;
  if (b.id === "suite") return suivant(), true;
  if (session.etape === "auto" && b.id === "valider-oral") {
    const pts = [...document.querySelectorAll("[data-pt]:checked")].map(c => +c.dataset.pt);
    proposer({ ok: pts.length >= Math.ceil(.7 * x.points.length), points: pts, rep: `${pts.length}/${x.points.length} points clés`, ms: x.ms });
    return true;
  }
  if (b.dataset.conf) { session.res.conf = b.dataset.conf; finaliser(); afficher(); document.getElementById("suite")?.focus(); return true; }
  if (session.etape === "repondre") {
    if (b.id === "nsp") { if (x.type === "explique") session.texte = document.getElementById("explication")?.value || ""; proposer({ ok: false, nsp: true, rep: "(je ne sais pas)" }); return true; }
    if (b.id === "passer") return passer(), true;
    if (b.id === "valider") return valider(), true;
    if (b.id === "voir") { session.texte = document.getElementById("explication").value; session.etape = "auto"; afficher(); return true; }
    if (b.id === "dit") { session.texte = document.getElementById("explication").value.trim(); x.ms = Date.now() - x.debut; session.etape = "auto"; afficher(); return true; }
    if (b.dataset.pick !== undefined) { x.pris.push(+b.dataset.pick); afficher(); return true; }
    if (b.dataset.retire !== undefined) { x.pris.splice(+b.dataset.retire, 1); afficher(); return true; }
    if (b.dataset.g !== undefined) { x.sel = +b.dataset.g; x.flash = null; afficher(); return true; }
    if (b.dataset.d !== undefined && x.sel !== null) {
      const j = +b.dataset.d;
      if (j === x.sel) { x.trouves.push(j); x.flash = null; } else { x.fautes++; x.flash = j; }
      x.sel = null;
      if (x.trouves.length === x.couples.length) proposer({ ok: x.fautes === 0, rep: x.fautes ? `${x.fautes} erreur(s)` : "sans faute" });
      else afficher();
      return true;
    }
    if (b.dataset.i !== undefined) {
      const i = +b.dataset.i;
      if (x.type === "erreur") proposer({ ok: i === x.faux, r: i, rep: x.texte[i] });
      else proposer({ ok: i === x.bonne, r: i, rep: x.choix[i] });
      return true;
    }
  }
  if (session.etape === "auto" && b.dataset.auto) { proposer({ ok: b.dataset.auto === "1", rep: b.dataset.auto === "1" ? "auto-évaluation : l'essentiel" : "auto-évaluation : incomplet" }); return true; }
  return false;
}

function vueFin() {
  if (session.mode === "logique") return vueFinLogique();
  if (session.mode === "simulation") return vueFinSimulation();
  if (session.mode === "entretien") return vueFinOral();
  const ratees = [...session.ratees].map(id => D.questions.find(q => q.id === id));
  return `
    <section class="card hero">
      <span class="label">Session terminée</span>
      <h2>${session.justes} / ${session.total} du premier coup</h2>
      <p>+${session.xp} XP · série de ${etat.serie} jour${etat.serie > 1 ? "s" : ""}</p>
      ${ratees.length ? `<div class="piege"><b>À retravailler :</b> ${ratees.map(q => esc(paire(q.paire).items.map(i => i.mot).join(" / "))).filter((v, i, a) => a.indexOf(v) === i).join(" · ")}. Elles reviendront dès demain.</div>` : ""}
      <button class="big" id="retour">Retour</button>
    </section>
    ${carteEnvoi()}`;
}

// Recherche insensible à la casse et aux accents : « regle » trouve « règle ».
const sansAccents = s => String(s).normalize("NFD").replace(/\p{Diacritic}/gu, "").toLowerCase();
const textePaire = p => sansAccents([p.theme, p.piege, ...p.items.flatMap(i => [i.mot, i.en || "", i.phrase, i.image])].join(" "));   // on peut chercher en anglais (« gateway » trouve la passerelle)

// Le champ de recherche est rendu une seule fois ; à chaque lettre, seule la liste est remplacée (sinon le champ perdrait le focus et le clavier du téléphone se fermerait).
function vueLexique() {
  const themes = ["Tous", ...new Set(D.paires.map(p => p.theme))];
  return `
    <input type="search" id="recherche" class="recherche" placeholder="Chercher un mot (ex. : passerelle)" aria-label="Chercher dans le lexique" autocomplete="off" enterkeyhint="search" value="${esc(recherche)}">
    <div class="filtres">${themes.map(t => `<button data-f="${esc(t)}" aria-pressed="${t === filtre}">${esc(t)}</button>`).join("")}</div>
    <div id="liste-lexique">${listeLexique()}</div>`;
}

function listeLexique() {
  const mots = sansAccents(recherche).split(/\s+/).filter(Boolean);
  const liste = D.paires.filter(p => (filtre === "Tous" || p.theme === filtre) && mots.every(m => textePaire(p).includes(m)));
  if (!liste.length) return `<p class="note">Aucune paire ne contient « ${esc(recherche)} »${filtre === "Tous" ? "" : ` dans le thème ${esc(filtre)}`}.</p>`;
  return `${mots.length ? `<p class="note">${liste.length} paire${liste.length > 1 ? "s" : ""} trouvée${liste.length > 1 ? "s" : ""}</p>` : ""}
    ${liste.map(p => `
      <section class="card paire">
        <span class="label">${esc(p.theme)} · ne pas confondre</span>
        <h3>${esc(p.items.map(i => i.mot).join(" / "))}</h3>
        <div class="items">${p.items.map(i => `
          <div class="item"><span class="mot">${esc(i.mot)}</span>${i.en ? `<span class="en">🇬🇧 ${esc(i.en)}</span>` : ""}<p>${esc(i.phrase)}</p><p class="img">${esc(i.image)}</p></div>`).join("")}</div>
        <div class="piege"><b>Le piège :</b> ${esc(p.piege)}</div>
      </section>`).join("")}`;
}

function afficher() {
  chips();
  document.getElementById("tab-reviser").setAttribute("aria-selected", onglet === "reviser");
  document.getElementById("tab-lexique").setAttribute("aria-selected", onglet === "lexique");
  document.getElementById("tab-logique").setAttribute("aria-selected", onglet === "logique");
  const v = document.getElementById("vue");
  if (onglet === "lexique") { v.innerHTML = vueLexique(); v.style.display = "grid"; v.style.gap = "14px"; return; }
  v.style.display = "grid"; v.style.gap = "16px";
  // Une session n'est affichée que dans son propre onglet (Réviser ou Logique).
  const s = session && (onglet === "logique") === ["logique", "simulation"].includes(session.mode) ? session : null;
  v.innerHTML = s ? (s.fini ? vueFin() : vueSession()) : onglet === "logique" ? vueLogique() : accueil();
}

document.getElementById("vue").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.id === "go") demarrer(false);
  else if (b.id === "bonus") demarrer(true);
  else if (b.id === "go-logique") demarrerLogique();
  else if (b.id === "go-simu") demarrerSimulation();
  else if (b.id === "go-oral") demarrerOral();
  else if (b.dataset.simu) { etat.simuDuree = +b.dataset.simu; sauver(); afficher(); }
  else if (b.id === "calc-option") { etat.calc = !etat.calc; sauver(); afficher(); }
  else if (b.dataset.taille) { etat[b.dataset.cle] = +b.dataset.taille; sauver(); afficher(); }
  else if (b.dataset.fam) { etat.famLogique = b.dataset.fam; sauver(); afficher(); }
  else if (b.id === "concours") { etat.concours = !etat.concours; sauver(); afficher(); }
  else if (session && !session.fini && clicSession(b)) return;
  else if (b.id === "retour") { session = null; afficher(); }
  else if (b.id === "envoyer") envoyer();
  else if (b.dataset.f) { filtre = b.dataset.f; afficher(); }
});
document.getElementById("vue").addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.id === "saisie" && session && session.etape === "repondre") { e.preventDefault(); valider(); }
});
document.getElementById("vue").addEventListener("input", e => {
  if (e.target.id !== "recherche") return;
  recherche = e.target.value;
  document.getElementById("liste-lexique").innerHTML = listeLexique();
});
document.getElementById("tab-reviser").addEventListener("click", () => { onglet = "reviser"; afficher(); });
document.getElementById("tab-lexique").addEventListener("click", () => { onglet = "lexique"; afficher(); });
document.getElementById("tab-logique").addEventListener("click", () => { onglet = "logique"; afficher(); });

// Chrono de la logique : seul le compteur est mis à jour chaque seconde ; en mode concours, le temps écoulé compte comme une erreur.
// Simulation : un seul chrono pour tout le test ; quand il tombe à zéro, la copie est rendue (même si on est sur un autre onglet).
// Entretien oral : le chrono montre le temps de parole.
setInterval(() => {
  if (!session || session.fini) return;
  if (session.mode === "simulation") {
    if (Date.now() >= session.fin) { finirSimulation(); return afficher(); }
    const c = document.getElementById("chrono-simu"); if (c) c.textContent = resteSimu();
    return;
  }
  if (!["logique", "entretien"].includes(session.mode) || session.etape !== "repondre") return;
  const x = session.file[0]; if (!x || !x.debut) return;
  if (session.mode === "logique" && onglet === "logique" && etat.concours && Date.now() - x.debut >= FAMILLES[x.fam].limite * 1000) return proposer({ ok: false, temps: true, rep: "(temps écoulé)" });
  const c = document.getElementById("chrono"); if (c) c.textContent = chronoTexte(x);
}, 1000);

fetch("memo-cyber.json", { cache: "no-store" })
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(d => {
    D = d;
    // La logique a son propre onglet (exercices générés, avec chrono) : ses cartes sortent des révisions.
    D.questions = D.questions.filter(q => paire(q.paire)?.theme !== "Logique");
    document.getElementById("note").textContent = (stockage ? "Ta progression reste enregistrée sur cet appareil." : "Ta progression ne peut pas être enregistrée ici (navigation privée ?).") + ` Cartes mises à jour le ${new Date(d.maj + "T12:00:00").toLocaleDateString("fr-FR")}.`;
    afficher();
  })
  .catch(e => { document.getElementById("vue").innerHTML = `<section class="card"><p class="err">Impossible de charger les cartes (${esc(e.message)}). Il faut republier le mémo avec memo-cyber.json.</p></section>`; });
</script>

<script>
// Installation hors ligne ; quand une nouvelle version arrive, la page se recharge une fois d'elle-même.
if ("serviceWorker" in navigator && location.protocol !== "file:") {
  var dejaControlee = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener("controllerchange", function () { if (dejaControlee) location.reload(); });
  navigator.serviceWorker.register("sw.js").catch(function () {});
}
</script>
